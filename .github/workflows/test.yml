name: Tests

# Runs the server-side test suite on pull requests and on every branch push, so
# the authorization rules in Code.js are checked before anything reaches main
# (the deploy workflow runs the same suite again before pushing to Apps Script).

on:
  pull_request: {}
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # No dependencies: the suite loads Code.js into a vm with mocked
      # Apps Script services. See test/README.md.
      - name: Run tests
        run: node test/run.js
