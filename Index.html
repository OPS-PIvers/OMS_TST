<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Fonts: Lexend -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  

  <style>
    /* Custom Loader using Brand Colors */
    .loader {
      border: 4px solid #eaecf5; /* ops-blue-lighter */
      border-top: 4px solid #2d3f89; /* ops-blue */
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    
    body {
      color: #333333; /* ops-gray-dark */
    }
    
    /* Smooth transitions for tabs */
    .tab-btn {
      transition: all 0.2s ease-in-out;
    }
    
    /* Segmented Toggle */
    .segmented-control {
        background-color: #f3f4f6; /* gray-100/200ish */
        padding: 4px;
        border-radius: 8px;
        display: inline-flex;
        gap: 4px;
    }
    .segmented-item {
        flex: 1;
        text-align: center;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.2s;
        color: #6b7280; /* gray-500 */
    }
    .segmented-item.active {
        background-color: white;
        color: #2d3f89; /* ops-blue */
        box-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    .segmented-item:hover:not(.active) {
        color: #374151; /* gray-700 */
        background-color: #e5e7eb;
    }

    /* Profile Dropdown */
    .profile-menu {
        transform-origin: top right;
        transition: all 0.1s ease-out;
    }
    
    /* Toast Animations */
    @keyframes slideIn {
      from { transform: translateX(100%); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .toast-enter {
      animation: slideIn 0.3s ease-out forwards;
    }
    .toast-exit {
      animation: fadeOut 0.3s ease-out forwards;
    }
  </style>

  <script>
    // --- HTML Escaping ---
    // Staff names/emails, transaction fields, config values and server messages
    // are user-controlled. Escape every one of them before it goes into markup
    // (text or a quoted attribute). Never put them inside an inline handler's JS
    // string — put them in a data-* attribute and read this.dataset.x instead.
    function escapeHtml(value) {
      return String(value == null ? '' : value)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    // --- Name Display ---
    // Names are stored "First Last" everywhere (the sheet, requests, emails). A person
    // can choose to *see* them "Last, First" (STATE.prefs.nameOrder === 'last'). Only
    // what is drawn changes: data-* attributes, <option value>s and anything sent to the
    // server must keep the stored name, because requests and Form Responses are
    // matched on it. Emails and sentence-style prompts stay "First Last".

    const SURNAME_PARTICLES = ['van', 'von', 'der', 'den', 'de', 'del', 'della', 'da', 'di', 'du', 'la', 'le', 'st', 'st.'];

    // { given, surname, suffix } — surname takes lowercase-style particles with it
    // ("Van Der Berg"), and a trailing Jr./III is kept apart so it doesn't become the surname.
    function splitName(name) {
      const tokens = String(name == null ? '' : name).trim().replace(/,/g, ' ').split(/\s+/).filter(Boolean);
      let suffix = '';
      if (tokens.length > 2 && NAME_SUFFIXES.includes(tokens[tokens.length - 1].toLowerCase().replace(/\.$/, ''))) {
        suffix = tokens.pop();
      }
      if (tokens.length < 2) return { given: '', surname: tokens.join(' '), suffix: suffix };
      let start = tokens.length - 1;
      while (start > 1 && SURNAME_PARTICLES.includes(tokens[start - 1].toLowerCase())) start--;
      return { given: tokens.slice(0, start).join(' '), surname: tokens.slice(start).join(' '), suffix: suffix };
    }

    function nameIsLastFirst() {
      return !!(STATE.prefs && STATE.prefs.nameOrder === 'last');
    }

    /** A staff member's name, in the viewer's chosen order. Returns plain text — escape it. */
    function displayName(name) {
      const raw = String(name == null ? '' : name).trim();
      if (!nameIsLastFirst() || !raw || raw.includes(',')) return raw;
      const parts = splitName(raw);
      if (!parts.given) return raw;
      return `${parts.surname}, ${parts.given}${parts.suffix ? ' ' + parts.suffix : ''}`;
    }

    /**
     * For free-text "covered for" values, which may be a person or something like
     * "Activity Bus". Only reordered when it matches someone in the directory.
     */
    function displayCoveredName(name) {
      if (!nameIsLastFirst()) return String(name == null ? '' : name);
      const key = String(name == null ? '' : name).trim().toLowerCase();
      const rosters = [STATE.user && STATE.user.staffData, STATE.viewAs && STATE.viewAs.admin && STATE.viewAs.admin.staffData];
      const known = rosters.some(list => (list || []).some(s => String(s.name || '').trim().toLowerCase() === key));
      return known ? displayName(name) : String(name == null ? '' : name);
    }

    // --- Toast Notification System ---
    // The message is plain text (never HTML).
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      
      // Icons and Colors based on type
      let icon, bgClass, textClass, borderClass;
      
      if (type === 'success') {
        icon = 'fa-check-circle';
        bgClass = 'bg-white';
        textClass = 'text-green-800';
        borderClass = 'border-green-500';
      } else if (type === 'error') {
        icon = 'fa-exclamation-circle';
        bgClass = 'bg-white';
        textClass = 'text-red-800';
        borderClass = 'border-red-500';
      } else { // info
        icon = 'fa-info-circle';
        bgClass = 'bg-white';
        textClass = 'text-ops-blue';
        borderClass = 'border-ops-blue';
      }

      const toast = document.createElement('div');
      toast.className = `toast-enter pointer-events-auto transform w-80 max-w-sm rounded-lg shadow-lg border-l-4 ${borderClass} ${bgClass} p-4 flex items-start gap-3`;
      
      toast.innerHTML = `
        <div class="flex-shrink-0 mt-0.5">
          <i class="fas ${icon} ${textClass} text-lg"></i>
        </div>
        <div class="flex-1">
          <p class="text-sm font-medium ${textClass}"></p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 transition">
          <i class="fas fa-times"></i>
        </button>
      `;
      toast.querySelector('p').textContent = String(message);

      container.appendChild(toast);

      // Remove after 3 seconds
      setTimeout(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-exit');
        setTimeout(() => {
          if(toast.parentElement) toast.remove();
        }, 300); // Wait for exit animation
      }, 3000);
    }
    
    // --- Tooltip System ---
    function showTooltip(e, content) {
      const el = document.getElementById('global-tooltip');
      el.innerHTML = content;
      el.classList.remove('hidden');
      // Small delay to allow transition
      requestAnimationFrame(() => el.classList.remove('opacity-0'));
      
      moveTooltip(e);
    }

    function moveTooltip(e) {
      const el = document.getElementById('global-tooltip');
      if (el.classList.contains('hidden')) return;

      const x = e.clientX;
      const y = e.clientY;
      
      // Adjust positioning to avoid edge overflow
      const rect = el.getBoundingClientRect();
      const winW = window.innerWidth;
      const winH = window.innerHeight;
      
      let left = x + 15;
      let top = y + 15;
      
      if (left + rect.width > winW) left = x - rect.width - 10;
      if (top + rect.height > winH) top = y - rect.height - 10;
      
      el.style.left = `${left}px`;
      el.style.top = `${top}px`;
    }

    function hideTooltip() {
      const el = document.getElementById('global-tooltip');
      el.classList.add('opacity-0');
      setTimeout(() => el.classList.add('hidden'), 200);
    }

    // The first building listed for a staff member is their PRIMARY building.
    // Carry Over / Paid Out (and finalize) are owned by the primary building's

    function primaryBuildingOf(buildingCsv) {
       return (buildingCsv || '').toString().split(',').map(b => b.trim()).filter(Boolean)[0] || '';
    }

    // True if the current user may edit the owned columns (Carry Over / Paid Out)

    function canEditOwnedColumns(staff) {

    function canActOnRequestBuilding(building) {

        // --- Sorting Utility ---
    function sortStaffData(data, sortBy) {
       if (!data || data.length === 0) return data;

       const getLastName = (name) => {
          const p = splitName(name);
          return `${p.surname} ${p.given}`.trim().toLowerCase();
       };
       const getFirstName = (name) => name ? String(name).trim().toLowerCase() : '';

       return [...data].sort((a, b) => {
          if (sortBy === 'last_name') {
             return getLastName(a.name).localeCompare(getLastName(b.name));
          } else if (sortBy === 'first_name') {
             return getFirstName(a.name).localeCompare(getFirstName(b.name));
          } else if (sortBy === 'earned') {
             return (Number(b.earned) || 0) - (Number(a.earned) || 0);
          } else if (sortBy === 'used') {
             return (Number(b.used) || 0) - (Number(a.used) || 0);
          } else if (sortBy === 'carry_over') {
             return (Number(b.carryOver) || 0) - (Number(a.carryOver) || 0);
          } else if (sortBy === 'balance' || sortBy === 'total') {
             return (Number(b.total) || 0) - (Number(a.total) || 0);
          } else if (sortBy === 'amount') {
             const valA = a.hours !== undefined ? a.hours : (a.used !== undefined ? a.used : 0);
             const valB = b.hours !== undefined ? b.hours : (b.used !== undefined ? b.used : 0);
             return Number(valB) - Number(valA);
          } else if (sortBy === 'date_newest') {
             return new Date(b.date) - new Date(a.date);
          } else if (sortBy === 'date_oldest') {
             return new Date(a.date) - new Date(b.date);
          }
          // Default: whichever name leads in the viewer's display order
          return nameIsLastFirst()
             ? getLastName(a.name).localeCompare(getLastName(b.name))
             : getFirstName(a.name).localeCompare(getFirstName(b.name));
       });
    }

       // Note: Admin Create Request modal handles its own re-rendering via closing/reopening or updating DOM if needed. For now it re-reads state on open.
    }

    // --- Constants & Helpers ---
    function getPeriodOptions(selectedVal) {
      // Use periods from Config based on current building
      const buildingConf = STATE.config[STATE.building] || STATE.config[STATE.defaultBuilding];
      
      if (!buildingConf) {
        console.warn("getPeriodOptions: Configuration missing for", STATE.building);
        return "";
      }

      const periods = buildingConf.periods || [];

      return periods.map(p => {
        // Attempt to match exact string OR legacy short number (e.g. "1" matches "Period 1...")
        // We look for "Period {selectedVal} " at the start.
        const isSelected = selectedVal === p || (selectedVal && p.startsWith(`Period ${selectedVal} `));
        return `<option value="${escapeHtml(p)}" ${isSelected ? 'selected' : ''}>${escapeHtml(p)}</option>`;
      }).join('');
    }

    const BADGE_REQUEST = { inFlight: false, again: false };

    function updateBadges() {
      const isAdmin = STATE.user.role === 'Admin' || STATE.user.role === 'Super Admin' || STATE.user.isSuperAdmin;

      if (isAdmin) {
        // One count request at a time. Asking again while one is out queues a
        // single re-run for when it lands, so a burst of tab switches costs two
        // requests rather than one each, and the badge always ends on a count
        // asked for after the latest change (concurrent requests could land in
        // either order).
        if (BADGE_REQUEST.inFlight) { BADGE_REQUEST.again = true; return; }
        BADGE_REQUEST.inFlight = true;
        const settle = () => {
          BADGE_REQUEST.inFlight = false;
          if (BADGE_REQUEST.again) { BADGE_REQUEST.again = false; updateBadges(); }
        };
        google.script.run.withSuccessHandler(counts => {
          setBadge('badge-earned', counts.earned);
          setBadge('badge-used', counts.used);
          setBadge('badge-assignments', counts.assignments);
          settle();
        }).withFailureHandler(settle).getDashboardCounts(STATE.building);
        return;
      }

      // A teacher lands on My Report, so the Assignments tab's badge is what tells
      // them there is coverage of theirs still waiting to be recorded.
      if (STATE.user.role === 'Teacher') {
        google.script.run.withSuccessHandler(list => {
          STATE.myAssignments = list || [];
          setBadge('badge-my-assignments', countRecordableAssignments(STATE.myAssignments));
        }).getMyAssignments(STATE.user.email);

    function filterCarryOverTable(query) {
       const rows = document.querySelectorAll('#carry-over-table tbody tr');
       const q = query.toLowerCase();
       rows.forEach(row => {
          const text = row.querySelector('td').innerText.toLowerCase();
          row.style.display = text.includes(q) ? '' : 'none';
       });
    }

    function saveCarryOver(email) {
       const input = document.getElementById(`co-${email}`);
       if (!input) { showToast("Couldn't save — please reopen the Update Carry Over dialog and try again.", "warning"); return; }
       const val = parseFloat(input.value);
       
       if (isNaN(val)) {
          showToast("Invalid number.", "error");
          return;
       }
       
       // Visual feedback
       const btn = input.closest('tr').querySelector('button');
       const originalText = btn.innerText;
       btn.innerText = "Saving...";
       btn.disabled = true;
       
       google.script.run.withSuccessHandler(() => {
          btn.innerText = "Saved!";
          btn.classList.remove('text-ops-blue');
          btn.classList.add('text-green-600');
          setTimeout(() => {
             btn.innerText = originalText;
             btn.disabled = false;
             btn.classList.remove('text-green-600');
             btn.classList.add('text-ops-blue');
          }, 2000);
          showToast("Carry over updated.", "success");
       }).withFailureHandler(err => {
          btn.innerText = "Error";
          btn.classList.add('text-red-600');
          btn.disabled = false;
          showToast("Update failed: " + err, "error");
       }).updateStaffCarryOver(email, val);
    }

    const DAY_NAMES = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'];

    /**
     * The times to show for a period in Settings: what is stored, or failing that
     * whatever the label already says — which is how OMS periods have always
     * carried them, so nobody retypes twelve rows. Mirrors periodTimesFor_ on the
     * server, minus the day-group lookup.
     */
    function periodTimesForSettings(config, label, groupTimes) {
       if (groupTimes) {
          const override = groupTimes[label];
          // A day-specific time is opt-in per period; blank means "use the default".
          return (override && override.start && override.end) ? override : { start: '', end: '' };
       }
       const stored = (config.periodTimes || {})[label];
       if (stored && stored.start && stored.end) return stored;
       return parseTimeRangeLabel(label) || { start: '', end: '' };
    }

    /** Client-side twin of parseTimeRange_ — see Code.js for the 12-hour rule. */
    function parseTimeRangeLabel(text) {
       const m = /(\d{1,2}):(\d{2})\s*(?:[-–—]|to)\s*(\d{1,2}):(\d{2})\s*$/.exec(String(text || '').trim());
       if (!m) return null;
       const pad = n => String(n).padStart(2, '0');
       const to24 = (hRaw, mins) => {
          const h = Number(hRaw);
          const hour = (hRaw.length === 1 && h >= 1 && h <= 6) ? h + 12 : h;
          return pad(hour) + ':' + pad(Number(mins));
       };
       return { start: to24(m[1], m[2]), end: to24(m[3], m[4]) };
    }

    function dayGroupRowHtml(config, group) {
       const g = group || { name: '', days: [], times: {} };
       const periods = config.periods || [];
       return `
         <div class="day-group border border-gray-200 rounded p-3 bg-gray-50">

               <input type="text" name="dayGroupName" value="${escapeHtml(g.name || '')}" placeholder="Name (e.g. TTh)" class="w-40 rounded border-gray-300 p-2 border text-sm">
               <div class="flex gap-3 flex-grow flex-wrap">
                  ${DAY_NAMES.map(d => `
                    <label class="flex items-center text-xs text-ops-gray-dark">
                      <input type="checkbox" name="dayGroupDay" value="${escapeHtml(d)}" ${(g.days || []).indexOf(d) > -1 ? 'checked' : ''} class="rounded border-gray-300 text-ops-blue mr-1">${escapeHtml(d)}
                    </label>`).join('')}
               </div>
               <button type="button" onclick="removeDayGroup(this)" class="text-red-400 hover:text-red-600 p-2"><i class="fas fa-trash"></i></button>
            </div>
            ${periods.length === 0
              ? '<p class="text-xs text-gray-400">Add periods above and save first.</p>'
              : periods.map(p => {
                  const t = periodTimesForSettings(config, p, g.times || {});
                  return `
                  <div class="flex gap-2 items-center mb-1">
                     <span class="flex-grow text-xs text-ops-gray-dark truncate" title="${escapeHtml(p)}">${escapeHtml(p)}</span>
                     <input type="hidden" name="dayGroupPeriod" value="${escapeHtml(p)}">
                     <input type="time" name="dayGroupStart" value="${escapeHtml(t.start)}" class="w-28 rounded border-gray-300 p-1 border text-xs">
                     <input type="time" name="dayGroupEnd" value="${escapeHtml(t.end)}" class="w-28 rounded border-gray-300 p-1 border text-xs">
                  </div>`;
                }).join('')}
         </div>`;
    }

    /**
     * Copies this building's bell schedule out of the code into the live config.
     *
     * The code's schedule only seeds the App Config sheet when that sheet does not
     * exist, so a district that has been running for a while never picks up a
     * schedule added later — which is why these fields can sit empty while the
     * times are perfectly well defined in the source.
     */
    function loadBellSchedule() {
       const buildingCode = document.getElementById('settings-building-select').value;
       const status = document.getElementById('bell-schedule-status');

    /**
     * Runs the calendar check end to end. The work happens on the building admin's
     * trigger rather than here, so the result arrives a moment later and is polled
     * for — that indirection is the point: it is the only thing that proves their
     * trigger and their calendar rights, not the deployer's.
     */
    function startCalendarTest() {
       const buildingCode = document.getElementById('settings-building-select').value;
       const form = document.getElementById('settings-form');
       const entered = form.calendarId.value.trim();
       const saved = (STATE.config[buildingCode] || {}).calendarId || '';

       if (!entered) {
          setCalendarTestStatus('Enter a calendar ID first.', 'error');
          return;
       }
       if (entered !== saved) {
          setCalendarTestStatus('Save your changes first, then test.', 'error');
          return;
       }

       setCalendarTestStatus('Queued — waiting for the building\u2019s email trigger…', 'pending');
       google.script.run.withSuccessHandler(() => {
          pollCalendarTest(buildingCode, 0);
       }).withFailureHandler(err => {
          setCalendarTestStatus(String(err), 'error');
       }).sendTestCalendarEvent(buildingCode);
    }

    function pollCalendarTest(buildingCode, attempt) {
       // The queue trigger runs about once a minute, so give it a little over two.
       if (attempt > 26) {
          setCalendarTestStatus('No response yet. The email trigger for this building may not be installed — run TST Admin \u2192 Authorize Email Service.', 'error');
          return;
       }

       google.script.run.withSuccessHandler(result => {
          if (!result || result.state === 'pending') {
             setTimeout(() => pollCalendarTest(buildingCode, attempt + 1), 5000);
             return;
          }
          if (result.state === 'ok') {
             const name = result.calendarName ? ' (' + result.calendarName + ')' : '';
             setCalendarTestStatus('Working — event created and removed on ' + buildingCode + name + '.', 'ok');
          } else {
             setCalendarTestStatus(result.error || 'The test failed.', 'error');
          }
       }).withFailureHandler(err => {
          setCalendarTestStatus(String(err), 'error');
       }).getCalendarTestResult(buildingCode);
    }

    /**
     * Reads the day-specific schedules out of the Settings form. A group only
     * counts when it names at least one day and overrides at least one period —
     * an empty row is someone who opened it and changed their mind.
     */
    function collectDayGroups() {
       return Array.from(document.querySelectorAll('#day-groups-list .day-group')).map(group => {
          const nameInput = group.querySelector('input[name="dayGroupName"]');
          const days = Array.from(group.querySelectorAll('input[name="dayGroupDay"]:checked')).map(c => c.value);
          const periods = group.querySelectorAll('input[name="dayGroupPeriod"]');
          const starts = group.querySelectorAll('input[name="dayGroupStart"]');
          const ends = group.querySelectorAll('input[name="dayGroupEnd"]');

          const times = {};
          Array.from(periods).forEach((periodInput, i) => {
             const start = starts[i] ? starts[i].value : '';
             const end = ends[i] ? ends[i].value : '';
             if (start && end) times[periodInput.value] = { start: start, end: end };
          });

          return {
             name: nameInput ? nameInput.value.trim() : '',
             days: days,
             times: times
          };
       }).filter(g => g.days.length > 0 && Object.keys(g.times).length > 0);
    }

    function saveSettings() {
       const buildingCode = document.getElementById('settings-building-select').value;
       const form = document.getElementById('settings-form');
       
       // Start from what is stored rather than a bare object: saveBuildingConfig
       // replaces the whole row, so any field this form does not render would be
       // silently dropped on every save.
       const stored = STATE.config[buildingCode] || {};
       const config = Object.assign({}, stored, {
          name: form.name.value,
          scheduleType: form.scheduleType.value
       });

       if(config.scheduleType === 'time_range') {
          config.increment = parseFloat(form.increment.value) || 15;
          // These buildings record a span as the period itself, so the times are
          // already in the label and there is nothing per-period to store.
          delete config.periodTimes;
          delete config.dayGroups;
       } else {
          // Periods, each with the start/end a calendar event needs.
          const pInputs = form.querySelectorAll('input[name="period[]"]');
          const startInputs = form.querySelectorAll('input[name="periodStart[]"]');
          const endInputs = form.querySelectorAll('input[name="periodEnd[]"]');

          config.periods = [];
          config.periodTimes = {};
          Array.from(pInputs).forEach((input, i) => {
             const label = input.value.trim();
             if (!label) return;
             config.periods.push(label);
             const start = startInputs[i] ? startInputs[i].value : '';
             const end = endInputs[i] ? endInputs[i].value : '';
             if (start && end) config.periodTimes[label] = { start: start, end: end };
          });

          config.dayGroups = collectDayGroups();
       }

       // Get Coverage
       const cLabels = form.querySelectorAll('input[name="covLabel[]"]');
       const cValues = form.querySelectorAll('input[name="covValue[]"]');
       config.coverageTypes = [];
       
       for(let i=0; i<cLabels.length; i++) {
          if(cLabels[i].value.trim() !== "") {
             let val = cValues[i].value;
             // Try parse float if it looks like a number
             if(!isNaN(val) && val.trim() !== "") {
                val = parseFloat(val);
             }
             config.coverageTypes.push({
                label: cLabels[i].value,
                value: val
             });
          }
       }

       if (form.calendarId) {
          config.calendarId = form.calendarId.value.trim();
          config.calendarName = form.calendarName.value.trim();
       }

       // Carry Over cap is Super-Admin-owned. Supers save the edited value;
       // everyone else preserves what's stored (the server enforces this too).
       // Default to 12 when unset.
       if (STATE.user.isSuperAdmin && form.carryOverMax) {
          const capVal = parseFloat(form.carryOverMax.value);
          config.carryOverMax = (isFinite(capVal) && capVal >= 0) ? capVal : 12;
       } else {
          const stored = STATE.config[buildingCode] ? STATE.config[buildingCode].carryOverMax : undefined;
          config.carryOverMax = (stored !== undefined && stored !== null && stored !== '') ? stored : 12;
       }

       try {
          showLoading(true);
          google.script.run.withSuccessHandler(() => {
             // Update local state
             STATE.config[buildingCode] = config;
             
             showLoading(false);
             closeModal();
             showToast("Configuration saved successfully.", "success");
             
             // If we edited current building, refresh view
             if (buildingCode === STATE.building) {
                updateUserInfo();
                // If we changed schedule types, re-render form
                if(STATE.currentTab === 'teacher-submit') renderTeacherSubmit();
             }
             
          }).withFailureHandler(err => {
             showLoading(false);
             showToast("Failed to save: " + err, "error");
          }).saveBuildingConfig(buildingCode, config);
          
       } catch (e) {
          showToast("Error: " + e.message, "error");
       }
    }

    function switchTab(tabId) {
      STATE.currentTab = tabId;
      
      // Reset all tabs to inactive state
      document.querySelectorAll('#nav-tabs button').forEach(b => {
        // Remove Active Classes
        b.classList.remove('bg-gray-50', 'border-ops-blue-dark');

        // Restore inactive hover background (blue tint over the blue navbar)
        b.classList.remove('hover:bg-gray-100');
        b.classList.add('hover:bg-ops-blue-light');

        // Reset Label Color to light blue
        const label = b.querySelector('.font-bold');
        if (label) {
            label.classList.remove('text-ops-blue');
            label.classList.add('text-blue-100', 'group-hover:text-white');
        }

        // Reset Subtext Color to dimmer blue
        const sub = b.querySelector('.uppercase');
        if (sub) {
            sub.classList.remove('text-ops-gray');
            sub.classList.add('text-blue-200', 'group-hover:text-blue-50');
        }

        // Reset Icon Color (and restore the white-on-hover behavior for inactive tabs)
        const icon = b.querySelector('i');
        if (icon) {
            icon.classList.remove('text-ops-blue');
            icon.classList.add('text-blue-200', 'group-hover:text-white');
        }
      });

      const activeBtn = document.getElementById(`btn-${tabId}`);
      if (!activeBtn) return; // Guard clause

      // Apply Active Classes — swap the blue-tint hover for a subtle light-gray
      // hover so the active (white) tab still gives feedback on hover.
      activeBtn.classList.remove('hover:bg-ops-blue-light');
      activeBtn.classList.add('bg-gray-50', 'border-ops-blue-dark', 'hover:bg-gray-100');

      // Update Inner Text Colors for Active State
      const label = activeBtn.querySelector('.font-bold');
      if (label) {
        label.classList.remove('text-blue-100', 'group-hover:text-white');
        label.classList.add('text-ops-blue');
      }

      const sub = activeBtn.querySelector('.uppercase');
      if (sub) {
        sub.classList.remove('text-blue-200', 'group-hover:text-blue-50');
        sub.classList.add('text-ops-gray');
      }

      // Keep the active icon dark on hover (remove the white-on-hover rule that
      // otherwise makes it vanish against the light active-tab background).
      const icon = activeBtn.querySelector('i');
      if (icon) {
        icon.classList.remove('text-blue-200', 'group-hover:text-white');
        icon.classList.add('text-ops-blue');
      }

      // Loader — or, when this tab was loaded before for the same building and
      // person, its last copy, locked until the fresh one below replaces it.
      const container = document.getElementById('view-container');
      tabLoaded();
      if (!showCachedTab(tabId)) {
        container.innerHTML = `<div class="flex flex-col items-center justify-center p-20"><div class="loader mb-4"></div><span class="text-ops-gray">Loading data...</span></div>`;
      }

      // Dispatch
      if (tabId === 'admin-earned') loadAdminEarned();
      else if (tabId === 'admin-assignments') loadAdminAssignments();
      else if (tabId === 'admin-used') loadAdminUsed();
      else if (tabId === 'admin-totals') loadAdminTotals();
      else if (tabId === 'admin-schedule') loadAdminSchedule();
      else if (tabId === 'teacher-submit') renderTeacherSubmit();
      else if (tabId === 'teacher-assignments') loadMyAssignments();
      else if (tabId === 'teacher-schedule') loadTeacherSchedule();
      else if (tabId === 'teacher-totals') loadTeacherTotals();
    }

    // --- Tab cache ---
    //
    // Returning to a tab used to show a spinner until the server answered. Each
    // admin tab now keeps the data it last drew, and switchTab redraws that copy
    // straight away while the tab's loader fetches a fresh one, exactly as before.
    //
    // The copy is drawn locked (inert, dimmed) and stays that way until the fresh
    // data has replaced it, so nothing can ever be acted on from it — Approve and
    // Deny address spreadsheet rows by number, and those shift. It is only used
    // for the same building and the same person (View As has its own), and it is
    // never used in place of fetching: every visit still loads fresh data.
    const TAB_CACHE = {};

    function tabCacheKey() {
      return [STATE.building, (STATE.user && STATE.user.email) || '', STATE.showArchived ? 1 : 0].join('|');
    }

    function cacheTab(tabId, data) {
      TAB_CACHE[tabId] = { key: tabCacheKey(), data: data };
    }

    /** Draws the tab's last copy, locked. False when there is none to draw. */
    function showCachedTab(tabId) {
      const entry = TAB_CACHE[tabId];
      if (!entry || entry.key !== tabCacheKey()) return false;
      const d = entry.data;
      // Each branch does what the tab's own loader does before and after fetching,
      // minus the fetch itself.
      if (tabId === 'admin-earned') {
        if (!STATE.selectedEarned) STATE.selectedEarned = new Set();
        STATE.pendingEarned = d;
        renderEarnedTable();
      } else if (tabId === 'admin-used') {
        if (!STATE.selectedUsed) STATE.selectedUsed = new Set();
        STATE.pendingUsed = d;
        renderUsedTable();
      } else if (tabId === 'admin-assignments') {
        STATE.assignments = d;
        renderAdminAssignments(STATE.assignments);
      } else if (tabId === 'admin-totals') {
        STATE.selectionMode = false;
        STATE.selectedEmails = new Set();
        STATE.user.staffData = d;
        renderAdminTotalsTable(d);
      } else if (tabId === 'admin-schedule') {
        STATE.scheduleData = d.schedule;
        STATE.scheduleNotes = d.notes;
        STATE.editingSchedule = null;
        renderAdminSchedule();
      } else {
        return false;
      }
      const container = document.getElementById('view-container');
      container.inert = true;
      container.setAttribute('aria-busy', 'true');
      container.style.opacity = '0.6';
      return true;
    }

    /** The fresh data is drawn (or failed to come): unlock the view. */
    function tabLoaded() {
      const container = document.getElementById('view-container');
      if (!container) return;
      container.inert = false;
      container.removeAttribute('aria-busy');
      container.style.opacity = '';
    }

    /**
     * The fresh data did not come. A locked copy on screen must never be unlocked
     * in its place — its row numbers may be out of date — so it is replaced with a
     * plain error; with no copy, the spinner stays, as it always has.
     */
    function discardCachedView() {
      const container = document.getElementById('view-container');
      if (container && container.inert) {
        container.innerHTML = `<div class="p-10 text-center text-ops-gray"><i class="fas fa-exclamation-triangle text-3xl mb-3 text-gray-300"></i><p class="font-bold text-ops-gray-dark">This could not be refreshed.</p><p class="text-sm">Open the tab again to retry.</p></div>`;
      }
      tabLoaded();
    }

    function tabLoadFailed(what, err) {
      discardCachedView();
      showToast("Error loading " + what + ": " + (err && err.message ? err.message : err), "error");
    }

    function toggleSelectionMode() {
      STATE.selectionMode = !STATE.selectionMode;
      STATE.manageMode = false; // mutually exclusive
      STATE.selectedEmails = new Set(); // Reset selection
      renderAdminTotalsTable(STATE.user.staffData);
    }

    function toggleManageMode() {
      STATE.manageMode = !STATE.manageMode;
      STATE.selectionMode = false; // mutually exclusive
      if (!STATE.manageMode && STATE.showArchived) {
        // Leaving manage mode hides archived again
        STATE.showArchived = false;
        loadAdminTotals();
        return;
      }
      renderAdminTotalsTable(STATE.user.staffData);
    }

      STATE.showArchived = !STATE.showArchived;
      loadAdminTotals(); // archived inclusion is decided server-side
    }

      const isChecked = checkbox.checked;
      STATE.selectedEmails = new Set();
      
      if (isChecked) {
        // Only select currently visible/filtered rows if possible? 
        // For simplicity, let's select all in the current rendered list.
        // We'll rely on the DOM or re-scan the data. 
        // Better: Use the data passed to render logic if available, but here we just have STATE.user.staffData.
        // Let's assume we want to select ALL visible in the table (which might be filtered).
        // Since filtering happens via DOM manipulation in 'filterStaffTable' (likely), we might grab all visible inputs.
        // But 'filterStaffTable' hides rows.
        
        // Actually, let's just select ALL data for now to be safe/consistent, or just what is visible.

      if (STATE.selectedEmails.has(email)) {
        STATE.selectedEmails.delete(email);

       if(btn) {
         const count = STATE.selectedEmails.size;
         btn.innerHTML = `<i class="fas fa-paper-plane mr-2"></i> Send to Selected (${count})`;
         btn.disabled = count === 0;

    function sendSelectedReports() {
      const count = STATE.selectedEmails.size;
      if (count === 0) return;

      openConfirmModal(
        "Send Reports?",
        `Are you sure you want to send email reports to <strong>${count}</strong> staff members?`,
        () => {
           showLoading(true);
           const emails = Array.from(STATE.selectedEmails);
           google.script.run.withSuccessHandler(res => {
             showLoading(false);
             showToast(`Sent: ${res.success}, Failed: ${res.failed}`, res.failed > 0 ? "warning" : "success");

    function toggleEarnedSelectionMode() {
      STATE.earnedSelectionMode = !STATE.earnedSelectionMode;
      STATE.selectedEarned = new Set(); // Reset
      renderEarnedTable(); // Re-render instantly
    }

    function toggleUsedSelectionMode() {
      STATE.usedSelectionMode = !STATE.usedSelectionMode;
      STATE.selectedUsed = new Set(); // Reset
      renderUsedTable(); // Re-render instantly
    }

    function toggleRowSelection(type, id, event) {
      if(event && event.target.tagName === 'BUTTON') return; // Ignore button clicks

      const set = type === 'earned' ? STATE.selectedEarned : STATE.selectedUsed;
      if (set.has(id)) set.delete(id);
      else set.add(id);
      
      // Re-render to update UI instantly
      if (type === 'earned') renderEarnedTable();
      else renderUsedTable();
    }

    function toggleBatchSelectAll(type, checkbox) {
      const isChecked = checkbox.checked;
      const set = type === 'earned' ? STATE.selectedEarned : STATE.selectedUsed;
      const data = type === 'earned' ? STATE.pendingEarned : STATE.pendingUsed;
      
      set.clear();
      if (isChecked) {
        data.forEach(r => set.add(r.rowIndex));
      }
      
      if (type === 'earned') renderEarnedTable();
      else renderUsedTable();
    }

    function batchAction(type, action) {
      const set = type === 'earned' ? STATE.selectedEarned : STATE.selectedUsed;
      const indices = Array.from(set);
      
      if (indices.length === 0) return showToast("No items selected.", "error");

      const actionName = action === 'approve' ? 'Approve' : (type === 'used' ? 'Delete' : 'Deny');
      
      let warning = `Are you sure you want to <strong>${actionName}</strong> ${indices.length} requests?`;
      
      // Specific warning for Denying Earned Requests (No Email)
      if (type === 'earned' && action === 'deny') {
        warning += `<div class="mt-4 bg-red-50 border-l-4 border-red-500 p-3 text-left">
           <p class="font-bold text-red-700 text-xs uppercase mb-1">Warning</p>
           <p class="text-sm text-red-900">Denying multiple requests will <strong>NOT</strong> send notification emails to teachers because you cannot provide specific reasons for each denial.</p>
        </div>`;
      }

      openConfirmModal(
        `Batch ${actionName}`,
        warning,
        () => {
           showLoading(true);
           const handler = `batch${action.charAt(0).toUpperCase() + action.slice(1)}${type.charAt(0).toUpperCase() + type.slice(1)}`; // e.g. batchApproveEarned
           
           google.script.run.withSuccessHandler(() => {
             showLoading(false);
             showToast(`Batch ${actionName} successful.`, "success");
             
             // Force full reload to ensure data freshness
             if(type === 'earned') {
               STATE.earnedSelectionMode = false;
               STATE.selectedEarned = new Set();
               loadAdminEarned();
             } else {
               STATE.usedSelectionMode = false;
               STATE.selectedUsed = new Set();
               loadAdminUsed();
             }
           }).withFailureHandler(err => {
             showLoading(false);
             showToast("Batch Error: " + err, "error");
           })[handler](indices);
        },
        `Confirm ${actionName}`,
        action === 'deny' || action === 'delete' ? 'bg-ops-red hover:bg-ops-red-dark' : 'bg-ops-blue hover:bg-ops-blue-dark'
      );
    }

       "Carry Over is normally set <strong>automatically</strong> when you run " +
       "<strong>Finalize School Year</strong>, which rolls each person's remaining balance " +

       if (col === 'carryOver' && !STATE.editMode[col]) {
          openConfirmModal(
             "Edit Carry Over manually?",

             () => applyColumnEditToggle(col),
             "Continue Editing"

          return;
       }
       applyColumnEditToggle(col);

       // Toggle logic
       STATE.editMode[col] = !STATE.editMode[col];

       // Clear pending updates if cancelling or starting fresh
       STATE.pendingUpdates = {};

       // Re-render
       renderAdminTotalsTable(STATE.user.staffData);

    function saveColumnUpdates(col) {
       const updates = STATE.pendingUpdates;
       if (Object.keys(updates).length === 0) {
          toggleColumnEdit(col); // Just exit
          return;
       }
       
       showLoading(true);
       google.script.run.withSuccessHandler(() => {
          showLoading(false);
          showToast("Updates saved successfully.", "success");
          STATE.editMode[col] = false;
          STATE.pendingUpdates = {};
          loadAdminTotals(); // Reload fresh data
       }).withFailureHandler(err => {
          showLoading(false);
          showToast("Update failed: " + err, "error");
       }).updateStaffBatch(updates, col);

                                   <button onclick="toggleColumnEdit('carryOver')" class="text-red-400 hover:text-red-600" title="Cancel"><i class="fas fa-times text-base"></i></button>
                                 </div>` : 
                                `<button onclick="toggleColumnEdit('carryOver')" class="text-gray-400 hover:text-ops-blue opacity-0 group-hover:opacity-100 transition-opacity" title="Edit Column"><i class="fas fa-pencil-alt"></i></button>`
                              }

                        </th>

                        <th class="px-2 py-3 text-left text-xs font-bold text-ops-gray uppercase tracking-wider bg-gray-50" style="${wCol}">Earned</th>
                        <th class="px-2 py-3 text-left text-xs font-bold text-ops-gray uppercase tracking-wider bg-gray-50" style="${wCol}">Used</th>

                        <!-- Paid Out Header -->
                        <th class="px-2 py-3 text-left text-xs font-bold text-ops-gray uppercase tracking-wider bg-gray-50 group cursor-pointer hover:bg-gray-100 transition-colors" style="${wCol}">
                           <div class="flex items-center justify-between">
                              <span>Paid Out</span>
                              ${editPaid ? 
                                `<div class="flex gap-1" onclick="event.stopPropagation()">
                                   <button onclick="saveColumnUpdates('paidOut')" class="text-green-600 hover:text-green-800" title="Save Changes"><i class="fas fa-save text-base"></i></button>
                                   <button onclick="toggleColumnEdit('paidOut')" class="text-red-400 hover:text-red-600" title="Cancel"><i class="fas fa-times text-base"></i></button>
                                 </div>` : 
                                `<button onclick="toggleColumnEdit('paidOut')" class="text-gray-400 hover:text-ops-blue opacity-0 group-hover:opacity-100 transition-opacity" title="Edit Column"><i class="fas fa-pencil-alt"></i></button>`
                              }
                           </div>
                        </th>

                        <th class="px-2 py-3 text-left text-xs font-bold text-ops-gray uppercase tracking-wider bg-gray-50" style="${wCol}">Balance</th>
                        <th class="px-2 py-3 text-center text-xs font-bold text-ops-gray uppercase tracking-wider bg-gray-50" style="${wCol}">Actions</th>
                      </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                  ${sortedStaff.map(s => {
                    const isChecked = STATE.selectedEmails && STATE.selectedEmails.has(s.email);
                    const eEmail = escapeHtml(s.email);
                    const eName = escapeHtml(s.name);               // attributes: the stored name
                    const eShown = escapeHtml(displayName(s.name)); // what is drawn
                    // Inline handlers read these via this.dataset — never interpolate the
                    // raw values into a JS string.
                    const rowAttrs = `data-email="${eEmail}" data-name="${eName}"`;

                    // Value for inputs: prioritize pendingUpdate if exists
                    const carryVal = (STATE.pendingUpdates[s.email] !== undefined && editCarry) ? STATE.pendingUpdates[s.email] : Number(s.carryOver);
                    const paidVal = (STATE.pendingUpdates[s.email] !== undefined && editPaid) ? STATE.pendingUpdates[s.email] : Number(s.paidOut);

                    // Carry Over / Paid Out are owned by the primary building.
                    const canEditOwned = canEditOwnedColumns(s);
                    const primaryB = s.primaryBuilding || primaryBuildingOf(s.building);
                    const ownedLockIcon = `<i class="fas fa-lock text-gray-300 ml-1" title="Managed by the primary building (${escapeHtml(primaryB)})"></i>`;
                    const pendingChip = s.pendingFinalize
                      ? `<span class="ml-1 text-[10px] font-bold uppercase tracking-wide text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded" title="Will be finalized by the primary building administrator (${escapeHtml(primaryB)})"><i class="fas fa-hourglass-half mr-1"></i>Pending finalize</span>`
                      : '';

                    return `
                    <tr ${rowAttrs} onclick="openStaffDetail(this.dataset.email, this.dataset.name)" class="cursor-pointer hover:bg-ops-blue-lighter transition-colors group ${s.archived ? 'bg-gray-50 opacity-60' : ''}">
                      ${isSel ? `
                        <td class="pl-6 pr-2 py-4 whitespace-nowrap" onclick="event.stopPropagation()">
                          <input type="checkbox" ${rowAttrs} onchange="toggleStaffSelection(this.dataset.email, this)" ${isChecked ? 'checked' : ''} class="rounded text-ops-blue focus:ring-ops-blue border-gray-300">
                        </td>
                      ` : ''}

                      <!-- Name -->
                      <td class="pl-6 pr-2 py-4 whitespace-nowrap text-sm font-medium text-ops-blue-dark truncate" style="${wName}" title="${eShown}">
                         <div>${eShown} ${s.archived ? '<span class="ml-1 text-[10px] font-bold uppercase tracking-wide text-gray-500 bg-gray-200 px-1.5 py-0.5 rounded">Archived</span>' : ''}${pendingChip}</div>
                         <div class="text-xs text-gray-400 font-normal truncate">${eEmail}</div>
                      </td>

                      <!-- Carry Over (owned by primary building) -->
                      <td class="px-2 py-4 whitespace-nowrap text-sm text-gray-600" style="${wCol}" onclick="event.stopPropagation()">
                         ${editCarry
                           ? (canEditOwned
                              ? `<input type="number" step="0.1" value="${escapeHtml(carryVal)}" ${rowAttrs} onchange="handleInputChange(this.dataset.email, 'carryOver', this.value)" class="w-full p-1 border border-gray-300 rounded text-sm focus:ring-ops-blue focus:border-ops-blue">`
                              : `<span class="text-gray-400">${Number(s.carryOver).toFixed(2)}${ownedLockIcon}</span>`)
                           : Number(s.carryOver).toFixed(2)
                         }
                      </td>

                      <td class="px-2 py-4 whitespace-nowrap text-sm text-ops-blue font-semibold" style="${wCol}">${Number(s.earned).toFixed(2)}</td>
                      <td class="px-2 py-4 whitespace-nowrap text-sm text-ops-red font-semibold" style="${wCol}">${Number(s.used).toFixed(2)}</td>

                      <!-- Paid Out (owned by primary building) -->
                      <td class="px-2 py-4 whitespace-nowrap text-sm text-gray-600" style="${wCol}" onclick="event.stopPropagation()">
                         ${editPaid
                           ? (canEditOwned
                              ? `<input type="number" step="0.1" value="${escapeHtml(paidVal)}" ${rowAttrs} onchange="handleInputChange(this.dataset.email, 'paidOut', this.value)" class="w-full p-1 border border-gray-300 rounded text-sm focus:ring-ops-blue focus:border-ops-blue">`
                              : `<span class="text-gray-400">${Number(s.paidOut).toFixed(2)}${ownedLockIcon}</span>`)
                           : Number(s.paidOut).toFixed(2)
                         }
                      </td>

                      <td class="px-2 py-4 whitespace-nowrap text-sm font-bold ${s.total < 0 ? 'text-ops-red' : 'text-ops-gray-dark'} bg-gray-50" style="${wCol}">${Number(s.total).toFixed(2)}</td>
                      
                      <!-- Actions -->
                      <td class="px-2 py-4 whitespace-nowrap text-center" style="${wCol}" onclick="event.stopPropagation()">
                         ${isManage ? (
                           s.archived ?
                           `<button ${rowAttrs} onclick="restoreStaffMember(this.dataset.email, this.dataset.name)" class="text-green-600 hover:text-green-800 hover:bg-green-50 p-2 rounded-full transition" title="Restore Staff">
                              <i class="fas fa-rotate-left"></i>
                            </button>` :
                           `<button ${rowAttrs} onclick="openEditStaffModal(this.dataset.email)" class="text-ops-blue hover:text-ops-blue-dark hover:bg-blue-50 p-2 rounded-full transition" title="Edit Staff">
                              <i class="fas fa-pencil-alt"></i>
                            </button>
                            <button ${rowAttrs} onclick="archiveStaffMember(this.dataset.email, this.dataset.name)" class="text-ops-red hover:text-red-700 hover:bg-red-50 p-2 rounded-full transition" title="Archive Staff">
                              <i class="fas fa-times"></i>
                            </button>`
                         ) : `
                           ${(s.role || '').toString().trim() === 'Teacher' ? `
                           <button ${rowAttrs} onclick="startViewAs(this.dataset.email)" class="text-ops-blue hover:text-ops-blue-dark hover:bg-blue-50 p-2 rounded-full transition" title="View as ${eShown}">
                              <i class="fas fa-eye"></i>
                           </button>` : ''}
                           <button ${rowAttrs} onclick="sendSingleReport(this.dataset.email, this.dataset.name)" class="text-ops-blue hover:text-ops-blue-dark hover:bg-blue-50 p-2 rounded-full transition" title="Send Report">
                              <i class="fas fa-paper-plane"></i>
                           </button>
                         `}
                      </td>
                    </tr>
                  `}).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
        document.getElementById('view-container').innerHTML = html;
        
        // Restore filter and focus
        if(currentQuery) {
          filterStaffTable(currentQuery);
          const newInput = document.querySelector('#view-container input[type="text"]');
          if(newInput) {
            newInput.focus();
            newInput.setSelectionRange(newInput.value.length, newInput.value.length);
          }
        }
        
        if(isSel) updateSendButton();
    }

    // --- View As ---
    // Lets an admin use the app exactly as a teacher in their building sees it.
    // The admin's session is set aside in STATE.viewAs and restored on exit;
    // anything submitted meanwhile is recorded under the teacher's email.

    function startViewAs(email) {
      if (STATE.viewAs) return;
      showLoading(true);
      google.script.run.withSuccessHandler(data => {
        showLoading(false);
        closeModal();
        STATE.viewAs = { admin: STATE.user, building: STATE.building };
        STATE.user = data;
        STATE.building = data.building;
        STATE.editMode = { carryOver: false, paidOut: false };
        STATE.pendingUpdates = {};

        document.getElementById('admin-add-btn').classList.add('hidden');
        renderViewAsBanner();
        updateUserInfo();
        renderNav();
        switchTab('teacher-totals');
        window.scrollTo(0, 0);
      }).withFailureHandler(err => {
        showLoading(false);
        showToast("Couldn't view as this staff member: " + err, "error");
      }).getViewAsData(email, STATE.building);
    }

    function exitViewAs() {
      if (!STATE.viewAs) return;
      const saved = STATE.viewAs;
      STATE.viewAs = null;
      STATE.user = saved.admin;
      STATE.building = saved.building;

      closeModal();
      document.getElementById('profile-dropdown').classList.add('hidden');
      document.getElementById('admin-add-btn').classList.remove('hidden');
      renderViewAsBanner();
      updateUserInfo();
      renderNav();
      updateBadges();
      switchTab('admin-totals');
    }

    /**
     * Warns an admin when their building's queued mail is not going out.
     *
     * Triggers belong to whoever installed them, so the app cannot see another
     * admin's — what it can see is the symptom: mail sitting Pending for longer
     * than a working trigger would ever leave it. That catches a trigger that was
     * never installed and one Apps Script has since disabled, whose failure notice
     * goes to its owner rather than to whoever notices the silence.
     */
    function checkEmailService() {
      const banner = document.getElementById('email-service-banner');
      if (!banner) return;

      const isAdmin = STATE.user.role === 'Admin' || STATE.user.role === 'Super Admin' || STATE.user.isSuperAdmin;
      if (!isAdmin || STATE.viewAs) {
        banner.classList.add('hidden');
        return;
      }

      google.script.run.withSuccessHandler(status => {
        if (!status || status.healthy || STATE.dismissedEmailBanner === status.building) {
          banner.classList.add('hidden');
          return;
        }
        renderEmailServiceBanner(status);
      }).withFailureHandler(() => {
        banner.classList.add('hidden');
      }).getEmailServiceStatus(STATE.building);
    }

    function renderEmailServiceBanner(status) {
      const banner = document.getElementById('email-service-banner');
      const building = escapeHtml(status.building);

      const explanation = status.reason === 'never'
        ? `Nobody has turned on TST email sending for <strong>${building}</strong> yet, so its messages and calendar entries are queuing up instead of going out.`
        : `TST email for <strong>${building}</strong> has been waiting ${escapeHtml(status.stalledMinutes)} minutes to send. Its email service has probably stopped &mdash; Google switches a trigger off after repeated failures and tells its owner, not you.`;

      const action = status.authorizeUrl
        ? `<a href="${escapeHtml(status.authorizeUrl)}?action=authorizeEmail" target="_blank" rel="noopener"
              class="inline-flex items-center bg-ops-blue hover:bg-ops-blue-dark text-white text-xs font-bold px-3 py-2 rounded shadow-sm whitespace-nowrap">
              <i class="fas fa-bolt mr-1"></i> Turn It Back On
           </a>`
        : `<span class="text-xs text-ops-gray-dark">Open the TST spreadsheet and choose <strong>TST Admin &rarr; Authorize Email Service</strong>.</span>`;

      banner.innerHTML = `
        <div class="bg-ops-red-lighter border-l-4 border-ops-red rounded p-4 flex items-start gap-4">
          <i class="fas fa-envelope-open-text text-ops-red text-xl mt-0.5"></i>
          <div class="flex-grow min-w-0">
            <p class="font-bold text-ops-red-dark text-sm">Email is not being sent for ${building}</p>
            <p class="text-sm text-ops-gray-dark mt-1">${explanation}</p>
          </div>
          <div class="flex items-center gap-3 shrink-0">
            ${action}
            <button onclick="dismissEmailBanner()" title="Hide until next sign-in" class="text-ops-gray hover:text-ops-gray-dark p-1"><i class="fas fa-times"></i></button>
          </div>
        </div>`;
      banner.classList.remove('hidden');
    }

    function dismissEmailBanner() {
      STATE.dismissedEmailBanner = STATE.building;
      document.getElementById('email-service-banner').classList.add('hidden');
    }

    function renderViewAsBanner() {
      const banner = document.getElementById('view-as-banner');
      if (!STATE.viewAs) {
        banner.classList.add('hidden');
        return;
      }
      // Built from nodes (not innerHTML) so directory names/emails can't inject markup.
      const text = document.getElementById('view-as-text');
      const name = document.createElement('strong');
      name.textContent = STATE.user.name;
      const email = document.createElement('span');
      email.className = 'opacity-75';
      email.textContent = `(${STATE.user.email})`;
      text.replaceChildren('Viewing as ', name, ' ', email, ' — anything you submit is recorded as this staff member.');
      banner.classList.remove('hidden');
    }

    // --- Staff Management (Add / Edit / Archive / Restore) ---

    function roleOptionsHtml(current) {
       return ['Teacher', 'Admin', 'Super Admin']
         .map(r => `<option value="${r}" ${r === current ? 'selected' : ''}>${r}</option>`).join('');
    }

    function buildingCheckboxesHtml(selectedCsv) {
       const selected = (selectedCsv || '').split(',').map(b => b.trim()).filter(Boolean);
       return Object.keys(STATE.config || {}).map(code => {
          const name = STATE.config[code].name || code;
          const checked = selected.includes(code) ? 'checked' : '';
          return `<label class="flex items-center gap-2 text-sm text-ops-gray-dark py-1 cursor-pointer">
             <input type="checkbox" name="building" value="${escapeHtml(code)}" ${checked} class="rounded text-ops-blue focus:ring-ops-blue border-gray-300">
             ${escapeHtml(code)} - ${escapeHtml(name)}
          </label>`;
       }).join('');
    }

    function getSelectedBuildings() {
       const boxes = document.querySelectorAll('#staff-form input[name="building"]:checked');
       return Array.from(boxes).map(b => b.value).join(', ');
    }

    function staffFormFieldsHtml(s) {
       // s is undefined for Add, or a staff object for Edit (email locked).
       const isEdit = !!s;
       const name = s ? escapeHtml(s.name || '') : '';
       const email = s ? escapeHtml(s.email) : '';
       const role = s ? s.role : 'Teacher';
       const carry = s ? Number(s.carryOver) : 0;
       const paid = s ? Number(s.paidOut) : 0;
       const buildingCsv = s ? s.building : STATE.building;

       const isSuper = STATE.user.isSuperAdmin;
       // Carry Over / Paid Out are owned by the primary building. New staff are
       // created in the adding admin's building (so they become primary); when
       // editing, only the primary admin (or Super Admin) may change them.
       const canEditOwned = isEdit ? canEditOwnedColumns(s) : true;
       const primaryB = s ? (s.primaryBuilding || primaryBuildingOf(s.building)) : STATE.building;
       const ownedRO = canEditOwned ? '' : 'readonly';
       const ownedCls = canEditOwned ? '' : 'bg-gray-100 text-gray-500 cursor-not-allowed';
       const ownedNote = canEditOwned ? '' :
          `<p class="text-[11px] text-gray-500 mt-1"><i class="fas fa-lock mr-1"></i>Managed by the primary building (${escapeHtml(primaryB)}).</p>`;
       const myBuildingName = (STATE.config[STATE.building] && STATE.config[STATE.building].name) ? STATE.config[STATE.building].name : STATE.building;
       const buildingBlock = isSuper ? `
           <div>
             <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Building(s)</label>
             <div class="border border-gray-200 rounded p-3 grid grid-cols-1 sm:grid-cols-2 gap-1">${buildingCheckboxesHtml(buildingCsv)}</div>
             <p class="text-xs text-gray-500 mt-1">Staff appear in the directory for every building they're assigned to.</p>
           </div>
         ` : `
           <div>
             <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Building</label>
             <div class="p-2 bg-gray-100 rounded border border-gray-200 font-bold text-ops-gray-dark">${escapeHtml(isEdit ? (buildingCsv || myBuildingName) : (myBuildingName + ' (' + STATE.building + ')'))}</div>
             <p class="text-xs text-gray-500 mt-1">${isEdit ? "Building assignment is managed per building. To add this person to another building, that building's admin adds them there." : "New staff are added to your building. If they also work in another building, that building's admin adds them separately."}</p>
           </div>
         `;

       return `
         <form id="staff-form" class="space-y-4" onsubmit="return false;">
           <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
             <div>
               <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Full Name *</label>
               <input type="text" name="name" value="${name}" required class="block w-full rounded border-gray-300 p-2 border focus:ring-ops-blue focus:border-ops-blue">
             </div>
             <div>
               <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Email ${isEdit ? '(locked)' : '*'}</label>
               <input type="email" name="email" value="${email}" ${isEdit ? 'readonly' : 'required'} class="block w-full rounded border-gray-300 p-2 border focus:ring-ops-blue focus:border-ops-blue ${isEdit ? 'bg-gray-100 text-gray-500 cursor-not-allowed' : ''}">
             </div>
           </div>
           <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
             <div>
               <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Role</label>
               <select name="role" class="block w-full rounded border-gray-300 p-2 border focus:ring-ops-blue focus:border-ops-blue">${roleOptionsHtml(role)}</select>
             </div>
             <div>
               <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Carry Over</label>
               <input type="number" step="0.1" name="carryOver" value="${carry}" ${ownedRO} class="block w-full rounded border-gray-300 p-2 border focus:ring-ops-blue focus:border-ops-blue ${ownedCls}">
               ${ownedNote}
             </div>
             <div>
               <label class="block text-xs font-bold text-ops-gray uppercase tracking-wider mb-2">Paid Out</label>
               <input type="number" step="0.1" name="paidOut" value="${paid}" ${ownedRO} class="block w-full rounded border-gray-300 p-2 border focus:ring-ops-blue focus:border-ops-blue ${ownedCls}">
               ${ownedNote}
             </div>
           </div>
           ${buildingBlock}
         </form>`;
    }

    function openAddStaffModal() {
       const html = `
         <div class="p-1">
           ${staffFormFieldsHtml(null)}
           <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
             <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50 font-bold text-sm">Cancel</button>
             <button onclick="submitAddStaff()" class="px-4 py-2 bg-ops-blue text-white rounded hover:bg-ops-blue-dark font-bold text-sm shadow"><i class="fas fa-user-plus mr-2"></i>Add Staff</button>
           </div>
         </div>`;
       showModal("Add Staff Member", html, 'max-w-2xl');
    }

    function openEditStaffModal(email) {
       const s = (STATE.user.staffData || []).find(x => x.email === email);
       if (!s) { showToast("Staff member not found.", "error"); return; }
       const html = `
         <div class="p-1">
           ${staffFormFieldsHtml(s)}
           <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">
             <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded text-gray-600 hover:bg-gray-50 font-bold text-sm">Cancel</button>
             <button data-email="${escapeHtml(s.email)}" onclick="submitEditStaff(this.dataset.email)" class="px-4 py-2 bg-ops-blue text-white rounded hover:bg-ops-blue-dark font-bold text-sm shadow"><i class="fas fa-save mr-2"></i>Save Changes</button>
           </div>
         </div>`;
       showModal("Edit Staff Member", html, 'max-w-2xl');
    }

    function submitAddStaff() {
       const form = document.getElementById('staff-form');
       const name = form.name.value.trim();
       const email = form.email.value.trim();
       if (!name || !email) { showToast("Name and email are required.", "error"); return; }

       const data = {
          name: name,
          email: email,
          role: form.role.value,
          building: getSelectedBuildings(),
          carryOver: form.carryOver.value,
          paidOut: form.paidOut.value
       };

       showLoading(true);
       google.script.run.withSuccessHandler(() => {
          showLoading(false);
          showToast("Staff member added.", "success");
          closeModal();
          loadAdminTotals();
       }).withFailureHandler(err => {
          showLoading(false);
          showToast("Add failed: " + (err.message || err), "error");
       }).addStaffMember(data);
    }

    function submitEditStaff(email) {
       const form = document.getElementById('staff-form');
       const name = form.name.value.trim();
       if (!name) { showToast("Name is required.", "error"); return; }

       const data = {
          name: name,
          role: form.role.value,
          building: getSelectedBuildings(),
          carryOver: form.carryOver.value,
          paidOut: form.paidOut.value
       };

       showLoading(true);
       google.script.run.withSuccessHandler(() => {
          showLoading(false);
          showToast("Staff member updated.", "success");
          closeModal();
          loadAdminTotals();
       }).withFailureHandler(err => {
          showLoading(false);
          showToast("Update failed: " + (err.message || err), "error");
       }).updateStaffMember(email, data);
    }

    function archiveStaffMember(email, name) {
       const bName = (STATE.config[STATE.building] && STATE.config[STATE.building].name) ? STATE.config[STATE.building].name : STATE.building;
       openConfirmModal(
          "Archive Staff Member?",
          `Archive <strong>${escapeHtml(name)}</strong> from <strong>${escapeHtml(bName)}</strong>? They'll be removed from this building's directory (but stay active in any other building they're assigned to). You can restore them anytime with the "Show archived" toggle.`,
          () => {
             showLoading(true);
             google.script.run.withSuccessHandler(() => {
                showLoading(false);
                showToast(name + " archived from " + STATE.building + ".", "success");
                loadAdminTotals();
             }).withFailureHandler(err => {
                showLoading(false);
                showToast("Archive failed: " + (err.message || err), "error");
             }).archiveStaffMember(email, STATE.building);
          },
          "Archive",
          "bg-ops-red hover:bg-red-700"
       );
    }

    function restoreStaffMember(email, name) {
       showLoading(true);
       google.script.run.withSuccessHandler(() => {
          showLoading(false);
          showToast(name + " restored to " + STATE.building + ".", "success");
          loadAdminTotals();
       }).withFailureHandler(err => {
          showLoading(false);
          showToast("Restore failed: " + (err.message || err), "error");
       }).restoreStaffMember(email, STATE.building);
    }

    // --- Year-End Finalize / Archived Years ---

    function suggestSchoolYearName() {
       const now = new Date();
       const y = now.getFullYear();
       const startYear = (now.getMonth() >= 6) ? y : y - 1; // July onward = new school year
       const yr = startYear + '-' + (startYear + 1);
       const code = STATE.building || STATE.defaultBuilding;
       return yr + ' ' + code + ' TST Totals';
    }

    function openFinalizeYearModal() {
       document.getElementById('profile-dropdown').classList.add('hidden');
       const bName = (STATE.config[STATE.building] && STATE.config[STATE.building].name) ? STATE.config[STATE.building].name : STATE.building;
       const cap = (STATE.config[STATE.building] && STATE.config[STATE.building].carryOverMax != null) ? STATE.config[STATE.building].carryOverMax : 12;
       const suggested = escapeHtml(suggestSchoolYearName());
       const eName = escapeHtml(bName);
       const eCap = escapeHtml(cap);
       const html = `
         <div class="p-1">

    function submitFinalizeYear() {
       const name = document.getElementById('finalize-name').value.trim();
       if (!name) { showToast("Please enter a name for the archive.", "error"); return; }
       openConfirmModal(
          "Finalize and roll over?",
          `This will create <strong>${escapeHtml(name)}</strong>, roll the combined balances of staff whose primary building is here into Carry Over, and archive their transactions. Shared staff with a primary elsewhere are only flagged. This cannot be undone. Continue?`,
          () => runFinalize(name, false),
          "Finalize",
          "bg-ops-red hover:bg-red-700"
       );
    }

    // Runs the finalize. force=false lets the server gate on over-cap balances
    // (returns { blocked } with no changes); force=true proceeds and forfeits the
    // excess. Shared by the confirm dialog and the over-cap "Finalize anyway" path.
    function runFinalize(name, force) {
       showLoading(true);
       google.script.run.withSuccessHandler(res => {
          showLoading(false);
          // Over-cap gate: nothing was changed — show the offending staff.
          if (res && res.blocked) {
             showOverCapModal(name, res);
             return;
          }
          let msg;
          if (res.count > 0) {
             msg = `Finalized ${res.count} staff into "${res.name}".`;
             if (res.forfeitedCount && res.forfeitedCount > 0) {
                msg += ` ${res.forfeitedCount} had hours above the ${res.cap}-hr cap forfeited.`;
             }
             if (res.pending && res.pending > 0) {
                msg += ` ${res.pending} shared staff flagged for their primary building.`;
             }
          } else if (res.pending && res.pending > 0) {
             // No staff are based here (all shared from elsewhere) — only flags were set.
             msg = `${res.pending} shared staff flagged for their primary building to finalize. No staff are based in this building.`;
          } else {
             msg = `Nothing to finalize for this building.`;
          }
          showToast(msg, "success");
          loadAdminTotals();
       }).withFailureHandler(err => {
          showLoading(false);
          showToast("Finalize failed: " + (err.message || err), "error");
       }).finalizeSchoolYear(name, STATE.building, force);
    }

           <p class="text-xs text-gray-500 mb-4">To keep these hours, close this, record their <strong>Paid Out</strong> hours in the directory (which lowers the balance), then finalize again. Otherwise you can finalize now and forfeit the excess.</p>

    // --- Snapshots (non-destructive directory captures) ---
    let _snapshotCache = [];

    function formatSnapDate(d) {
       if (!d) return '';
       const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(d));
       if (!m) return String(d);
       const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
       return dt.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }

    function openSnapshotsModal() {
       document.getElementById('profile-dropdown').classList.add('hidden');
       const header = `
         <div class="flex items-center justify-between mb-4">

       google.script.run.withSuccessHandler(list => {
          _snapshotCache = list || [];

          if (!body) return;
          if (!_snapshotCache.length) {
             body.innerHTML = '<p class="text-sm text-gray-400">No snapshots yet. Use "Create new snapshot" to capture the current directory totals.</p>';
             return;
          }
          body.innerHTML = _snapshotCache.map(s => `

              <div class="flex items-center gap-2 flex-shrink-0">
                <button data-id="${escapeHtml(s.id)}" onclick="viewSnapshot(this.dataset.id)" class="text-xs text-ops-blue hover:underline px-2 py-1"><i class="fas fa-eye mr-1"></i>View</button>

              </div>

          if (body) body.innerHTML = `<p class="text-sm text-ops-red">Failed to load: ${escapeHtml(err.message || err)}</p>`;
       }).listSnapshots();

    function openCreateSnapshotModal() {
       const today = new Date().toISOString().slice(0, 10);

          buildings = STATE.config ? Object.keys(STATE.config) : [];

          buildings = (STATE.user.buildings && STATE.user.buildings.length) ? STATE.user.buildings : [];

       if (!buildings.length) buildings = [STATE.building];

       let buildingField;
       if (buildings.length > 1) {
          const opts = buildings.map(b => {
             const bn = (STATE.config && STATE.config[b] && STATE.config[b].name) ? STATE.config[b].name : b;
             return `<option value="${escapeHtml(b)}" ${b === STATE.building ? 'selected' : ''}>${escapeHtml(bn)} (${escapeHtml(b)})</option>`;

       } else {
          buildingField = `<input type="hidden" id="snapshot-building" value="${escapeHtml(buildings[0])}">`;
       }

       const html = `
         <div class="p-1">
           <div class="bg-ops-blue-lighter border border-ops-blue rounded p-3 mb-4 text-sm text-ops-blue-dark">

           <input type="date" id="snapshot-date" value="${today}" class="block w-full rounded border-gray-300 p-2 border focus:ring-ops-blue focus:border-ops-blue">
           ${buildingField}
           <div class="flex justify-end gap-3 mt-6 pt-4 border-t border-gray-100">

         <div class="p-1">

       const s = _snapshotCache.find(x => x.id === id);
       const label = s ? s.title : 'this snapshot';

          () => {
             showLoading(true);
             google.script.run.withSuccessHandler(() => {
                showLoading(false);
                showToast("Snapshot deleted.", "success");
                openSnapshotsModal();

             }).deleteSnapshot(id);

          "Delete",

    function restoreSnapshotConfirm(id) {
       const cached = _snapshotCache.find(x => x.id === id);

       showLoading(true);
       google.script.run.withSuccessHandler(data => {

          _renderRestoreConfirm(id, data);

    function _renderRestoreConfirm(id, s) {
       const title = s.title || 'this snapshot';
       const bldg = s.building || '';
       const when = formatSnapDate(s.date);
       const msg = `
         <div class="text-left text-sm text-gray-600 space-y-2">
           <p>This reverts <strong>${escapeHtml(bldg)}</strong> to <strong>${escapeHtml(title)}</strong>${when ? ' (' + escapeHtml(when) + ')' : ''}. Afterward every column in each row will match this snapshot.</p>
           <ul class="list-disc pl-5 space-y-1">
             <li>The building's current approved transactions are <strong>archived</strong> (recoverable), then the snapshot's transactions are restored — so Earned and Used match the snapshot.</li>
             <li>Carry Over and Paid Out are reset to the snapshot values for staff whose <strong>primary building is ${escapeHtml(bldg)}</strong>.</li>
             <li>Staff who only earn hours in ${escapeHtml(bldg)} (primary building elsewhere) keep their current Carry Over / Paid Out — those belong to their primary building's admin.</li>
             <li>Staff added after the snapshot are left unchanged (no staff are deleted).</li>
             <li><strong>No other building is touched.</strong> This cannot be undone from the app.</li>
           </ul>
         </div>`;
       openConfirmModal(
          "Restore this snapshot?",
          msg,
          () => {
             showLoading(true);

    /** yyyy-MM-dd for today, to compare against an assignment's date key. */
    function todayKey() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    /**
     * Coverage a teacher has provided but not recorded. Upcoming assignments are
     * not actionable yet, so they stay off the badge — the same rule the server
     * uses for the admin badge.
     */
    function countRecordableAssignments(list) {
      const today = todayKey();
      return (list || []).filter(a =>
        a.role === 'covering' && a.status === 'Assigned' && a.date && a.date <= today).length;
    }

    function loadAdminAssignments() {
      google.script.run.withSuccessHandler(list => {
        STATE.assignments = list || [];
        cacheTab('admin-assignments', STATE.assignments);

        tabLoaded();

        discardCachedView();
        showToast("Error loading assignments: " + err, "error");

    function assignmentStatusChip(a) {
      if (a.status === 'Cancelled') {
        return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-gray-100 text-gray-500">Cancelled</span>`;
      }
      if (a.status === 'Recorded') {
        const byAdmin = /^admin:/.test(a.recordedBy || '');
        // 'filed': the teacher submitted the hours through the Submit form instead
        // of pressing Record, and the server matched the request to this assignment.
        if (a.recordedBy === 'filed') {
          return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-green-100 text-green-700" title="Filed through the Submit form rather than the Record button">Recorded (filed)</span>`;
        }
        return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-green-100 text-green-700">Recorded${byAdmin ? ' by admin' : ''}</span>`;
      }
      if (a.outstanding) {
        return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-ops-red-lighter text-ops-red">Not recorded</span>`;
      }
      return `<span class="text-xs font-bold px-2 py-1 rounded-full bg-ops-blue-lighter text-ops-blue-dark">Upcoming</span>`;
    }

    /**
     * Recorded and cancelled assignments are finished business, so the list opens on
     * the ones still open (upcoming, or past and not recorded) and keeps the rest
     * behind "Show history". Nothing is moved or deleted — the toggle only changes
     * what is drawn, and it stays as set for the rest of the session.
     */
    function isAssignmentHistory(a) {
      return a.status === 'Recorded' || a.status === 'Cancelled';

          ${list.length === 0
