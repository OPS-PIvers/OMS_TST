    /** Whole days between two yyyy-MM-dd keys (positive when `to` is later). */
    function daysBetweenKeys(from, to) {
      const parse = k => { const [y, m, d] = k.split('-').map(Number); return Date.UTC(y, m - 1, d); };
      return Math.round((parse(to) - parse(from)) / 86400000);
    }

    function relativeDayLabel(dateKey) {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey || '')) return '';
      const d = daysBetweenKeys(todayKey(), dateKey);
      if (d === 0) return 'today';
      if (d === 1) return 'tomorrow';
      if (d === -1) return 'yesterday';
      return d > 0 ? `in ${d} days` : `${-d} days ago`;
    }

    const ASSIGNMENT_DATE_TILE_TONES = {
      red: 'bg-ops-red-lighter text-ops-red border-red-200',
      blue: 'bg-ops-blue-lighter text-ops-blue-dark border-blue-200',
      gray: 'bg-gray-100 text-ops-gray border-gray-200'
    };

    /** Calendar-style date block, so the list scans by date. */
    function assignmentDateTile(dateKey, tone) {
      const cls = ASSIGNMENT_DATE_TILE_TONES[tone];
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateKey || '');
      if (!m) {
        return `<div class="flex-shrink-0 w-14 text-center rounded-lg border ${cls} py-3 font-bold">&mdash;</div>`;
      }
      const d = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      const mon = d.toLocaleString('en-US', { month: 'short' }).toUpperCase();
      const dow = d.toLocaleString('en-US', { weekday: 'short' });
      return `

    function handleTeacherSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const isOther = form.querySelector('#t-sub-type').value === 'Other';
      
      let bConfig = STATE.config[STATE.building];
      if (!bConfig) {
        console.warn(`Config for building '${STATE.building}' not found in handleTeacherSubmit. Using default.`);
        bConfig = STATE.config[STATE.defaultBuilding];
      }
      
      if (!bConfig) {
         showToast("Configuration error. Please contact support.", "error");
         return;
      }
      
      let period = "";
      let amountDecimal = 0;
      let amountType = "";

      if (bConfig.scheduleType === 'periods') {
         period = form.period.value;
         amountDecimal = parseFloat(form.duration.value);
         // Find label for this value
         const typeObj = bConfig.coverageTypes.find(t => Number(t.value) === amountDecimal);
         amountType = typeObj ? typeObj.label : (amountDecimal === 1 ? 'Full Period' : 'Half Period');
      } else {
         // Time Range Calculation
         const start = form.startTime.value;
         const end = form.endTime.value;
         period = `${start} - ${end}`;

         // Calculate diff in hours
         const d1 = new Date(`2000-01-01T${start}`);
         const d2 = new Date(`2000-01-01T${end}`);
         const diffMs = d2 - d1;
         const diffHrs = diffMs / (1000 * 60 * 60);

         if (diffHrs <= 0) {
           showToast("End time must be after start time.", "error");
           return;
         }

         amountDecimal = Number(diffHrs.toFixed(2));
         amountType = "Time Range";
      }

      const payload = {
        email: STATE.user.email,
        subbedForType: isOther ? 'Other' : 'Staff',
        subbedForName: isOther ? form.subbedNameManual.value : form.subbedNameDropdown.value,
        date: form.date.value,
        period: period,
        amountType: amountType,
        amountDecimal: amountDecimal,
        building: STATE.building
      };

      showLoading(true);
      google.script.run.withSuccessHandler(() => {
        showLoading(false);
        // Simple success banner instead of alert
        const container = document.getElementById('view-container');
        container.innerHTML = `
          <div class="max-w-xl mx-auto text-center p-10">
            <div class="inline-flex items-center justify-center h-20 w-20 rounded-full bg-green-100 mb-6">
              <i class="fas fa-check text-3xl text-green-600"></i>
            </div>
            <h2 class="text-2xl font-bold text-ops-blue-dark mb-2">Submission Received!</h2>
            <p class="text-ops-gray mb-6">Your TST earning request has been sent for approval.</p>
            <button onclick="switchTab('teacher-submit')" class="text-ops-blue font-bold hover:underline">Submit Another</button>
          </div>
        `;
      }).submitEarned(payload);
    }

    function addToQueue(type) {
      const initialLength = STATE.requestQueue.length;
      
      if (type === 'earn') {
        const teacherSelect = document.getElementById('earn-teacher-select');
        const email = teacherSelect.value;
        const teacherName = teacherSelect.options[teacherSelect.selectedIndex].getAttribute('data-name') || '';
        
        if (!email) { showToast("Please select a teacher.", "error"); return false; }

        const subType = document.getElementById('earn-subtype').value;
        let subName = "";
        if (subType === 'Staff') {
           const subSelect = document.getElementById('earn-sub-staff-select');
           if(subSelect.value) {
             subName = subSelect.options[subSelect.selectedIndex].getAttribute('data-name');
           } else {
             showToast("Please select who they subbed for.", "error"); return false;
           }
        } else {
           subName = document.getElementById('earn-sub-manual-input').value;
           if(!subName) { showToast("Enter manual reason.", "error"); return false; }
        }

        const date = document.getElementById('earn-date').value;
        if(!date) { showToast("Select a date.", "error"); return false; }

        const durationVal = document.querySelector('input[name="earn-duration"]:checked').value;
        const period = document.getElementById('earn-period').value;

        STATE.requestQueue.push({
          type: 'earned',
          summary: `<strong class="text-ops-blue">Earned</strong>: ${escapeHtml(displayName(teacherName))} (Sub: ${escapeHtml(displayCoveredName(subName))}) - ${escapeHtml(date)}`,
          payload: {
            email: email,
            subbedForType: subType,
            subbedForName: subName,
            date: date,
            period: period,
            amountType: durationVal == "1" ? "Full Period" : "Half Period",
            amountDecimal: parseFloat(durationVal)
          }
        });
        
        // Reset specific fields (keep Date)
        teacherSelect.value = "";
        document.getElementById('earn-sub-staff-select').value = "";
        document.getElementById('earn-sub-manual-input').value = "";

      } else {
        // USE
        const teacherSelect = document.getElementById('use-teacher-select');
        const email = teacherSelect.value;
        const name = teacherSelect.options[teacherSelect.selectedIndex].getAttribute('data-name');
        
        if (!email) { showToast("Please select a teacher.", "error"); return false; }
        
        const date = document.getElementById('use-date').value;
        const amount = document.getElementById('use-amount').value;
        const notes = document.getElementById('use-notes').value;
        
        if (!date || !amount) { showToast("Fill all fields.", "error"); return false; }

        STATE.requestQueue.push({
          type: 'used',
          summary: `<strong class="text-ops-red">Used</strong>: ${escapeHtml(displayName(name))} (${escapeHtml(amount)} hrs) - ${escapeHtml(date)}`,
          payload: {
            email: email,
            name: name,
            date: date,
            amount: parseFloat(amount),
            notes: notes
          }
        });

        // Reset fields (Keep Date)
        teacherSelect.value = "";
        document.getElementById('use-amount').value = "";
        document.getElementById('use-notes').value = "";
        document.getElementById('use-balance-hint').innerHTML = "";
      }

      renderQueue();
      return true;
    }
    
    function submitImmediate(type) {
      const teacherSelectId = type === 'earn' ? 'earn-teacher-select' : 'use-teacher-select';
      const teacherSelect = document.getElementById(teacherSelectId);
      
      // If user has started filling out the form (selected a teacher), try to add to queue.
      if (teacherSelect && teacherSelect.value) {
         if (addToQueue(type)) {
            submitBatch();
         }
      } else {
         // If no teacher selected, check if queue has items to submit
         if (STATE.requestQueue.length > 0) {
            submitBatch();
         } else {
            // If queue is empty AND form is empty, try to add to queue to trigger validation errors
            addToQueue(type);
         }
      }
    }

    function renderQueue() {
      const list = document.getElementById('queue-list');
      const container = document.getElementById('queue-container');
      
      if (STATE.requestQueue.length === 0) {
        container.classList.add('hidden');
        list.innerHTML = '';
      } else {
        container.classList.remove('hidden');
        list.innerHTML = STATE.requestQueue.map((item, idx) => `
          <div class="flex justify-between items-center bg-white p-2 mb-2 rounded border border-gray-200 text-xs shadow-sm">
             <div>${item.summary}</div>
             <button onclick="removeFromQueue(${idx})" class="text-red-400 hover:text-red-600 ml-2">
               <i class="fas fa-times-circle"></i>
             </button>
          </div>
        `).join('');
      }
    }

    function removeFromQueue(index) {
      STATE.requestQueue.splice(index, 1);
      renderQueue();
    }

    function submitBatch() {
      if (STATE.requestQueue.length === 0) return;
      
      const queue = [...STATE.requestQueue]; // Copy
      showLoading(true);

      google.script.run.withSuccessHandler(() => {
        showLoading(false);
        STATE.requestQueue = [];
        closeModal();
        // Refresh both views
        loadAdminEarned();
        loadAdminUsed();
        
        // Simple Toast/Alert
        showToast(`Successfully processed ${queue.length} requests.`, "success");
      }).withFailureHandler(err => {
         showLoading(false);
         showToast("Error processing batch: " + err, "error");
      }).processBatch(queue);
    }

    // --- SCHEDULE / AVAILABILITY VIEWS ---

    const MONTHS = ["September", "October", "November", "December", "January", "February", "March", "April", "May", "June"];
    const DAYS = ["Mon", "Tue", "Wed", "Thu", "Fri"];
    // PERIODS are now dynamic via STATE.config[STATE.building].periods

    function getPeriods() {
      // If config not loaded yet, default empty
      if(!STATE.config || !STATE.building) return [];

      let bConfig = STATE.config[STATE.building];

      // Fallback if specific building config is missing
      if (!bConfig) {
         console.warn(`Config for building '${STATE.building}' not found. Falling back to default '${STATE.defaultBuilding}'.`);
         bConfig = STATE.config[STATE.defaultBuilding];
      }

      // Final safety check
      if (!bConfig) {
        console.error(`Config not found for building '${STATE.building}' or default '${STATE.defaultBuilding}'.`);
        return [];
      }

      if (bConfig.scheduleType === 'periods') {
        return bConfig.periods;
      } else {
        // For Time Range buildings, avoid misleading hardcoded slots like "Morning"/"Afternoon".
        // If the building has custom periods configured, use those; otherwise, fall back to a
        // single neutral label that reflects that times are entered as ranges.
        if (Array.isArray(bConfig.periods) && bConfig.periods.length > 0) {
           return bConfig.periods;
        }
        return ["Time Range"];
      }
    }

    /**
     * Whether a grid row names a real period. A time_range building (OIS, SE) stores
     * an assignment's period as the time span that was picked, while its grid row is
     * a placeholder ("Time Range"), so the two can never be compared — there the day
     * is the whole of the cell.
     */
    function schedulePeriodsAreComparable() {
      const bConfig = (STATE.config || {})[STATE.building] ||
                      (STATE.config || {})[STATE.defaultBuilding] || {};
      return bConfig.scheduleType !== 'time_range';
    }

    // The part of a period label that names the period: "Period 3 - 9:52 - 10:39"
    // and a legacy "3" both read "period 3". A request filed before an admin
    // edited the bell times still lands on its row, because the times aren't compared.
    function schedulePeriodKey(label) {
      const s = String(label == null ? '' : label).split(' - ')[0].trim().toLowerCase();
      return /^[0-9]/.test(s) ? 'period ' + s : s;
    }

    /**
     * What a person already has on this cell's day (same month and weekday) in a
     * *different* period: pending requests and live assignments alike. The cell's
     * own period is left to the hourglass and the Assigned chips; this is what tells
     * an admin the person is already giving up a prep that day. A time_range
     * building has no other period to compare, and a request whose date couldn't be
     * read can't be placed on a day, so both yield nothing.
     */
    function otherPeriodsSameDay(t, month, day, period, comparePeriods) {
      if (!comparePeriods) return [];
      const key = schedulePeriodKey(period);
      const pending = (t.pendingRequests || [])
        .filter(r => r.month === month && r.weekday === day && schedulePeriodKey(r.period) !== key)
        .map(r => ({ kind: 'Pending', date: new Date(r.date).toLocaleDateString(), period: r.period, coveredFor: r.subbedFor }));
      const assigned = (t.assignments || [])
        .filter(a => a.month === month && a.weekday === day && a.period !== period && schedulePeriodKey(a.period) !== key)
        .map(a => ({ kind: a.recorded ? 'Recorded' : 'Assigned', date: a.dateDisplay, period: a.periodDisplay || a.period, coveredFor: a.coveredFor }));
      return pending.concat(assigned);
    }

             // Create map of Period -> Set(Days)

                            ${periods.map(p => `
                              <tr>
                                <td class="py-2 pl-2 font-medium text-gray-700">${escapeHtml(p)}</td>
                                ${DAYS.map(d => {
                                  const isChecked = availabilityMap[p] && availabilityMap[p].has(d);
                                  return `
                                    <td class="py-2 text-center">
                                      <input type="checkbox" name="${escapeHtml(p)}_${d}" ${isChecked ? 'checked' : ''} class="rounded text-ops-blue focus:ring-ops-blue border-gray-300 h-4 w-4">
                                    </td>`;
                                }).join('')}
                              </tr>
                            `).join('')}
                          </tbody>
                        </table>
                      </div>
                      <div class="mt-6 flex justify-end">
                        <button type="submit" class="bg-ops-blue text-white px-6 py-2 rounded shadow hover:bg-ops-blue-dark font-bold text-sm transition transform active:scale-95">
                          Save ${month} Availability
                        </button>
                      </div>
                   </form>
                 </div>
               </div>
             `;
           }).join('')}
         </div>
       `;
       
       document.getElementById('view-container').innerHTML = html;
    }

    function saveTeacherAvailability(e, month) {
      e.preventDefault();
      const form = e.target;
      const checkboxes = form.querySelectorAll('input[type="checkbox"]:checked');
      
      // Group by Period
      const periodMap = {}; // "Period 1" -> ["Mon", "Tue"]
      checkboxes.forEach(cb => {
         const [period, day] = cb.name.split('_');
         if (!periodMap[period]) periodMap[period] = [];
         periodMap[period].push(day);
      });
      
      // Convert to List
      const availabilityList = Object.keys(periodMap).map(p => ({
         period: p,
         days: periodMap[p].join(',')
      }));
      
      showLoading(true);
      google.script.run.withSuccessHandler(() => {
        showLoading(false);
        showToast(`${month} availability saved.`, "success");
      }).withFailureHandler(handleError)
        .saveAvailability(month, availabilityList, STATE.viewAs ? STATE.user.email : null, getPeriods());
    }

    function loadAdminSchedule() {
       // The grid and the admin's notes on it come back separately; draw once both are in.
       let data = null, notes = null;
       const done = () => {
         if (data === null || notes === null) return;
         STATE.scheduleData = data; // Save to state for editing
         STATE.scheduleNotes = notes;
         STATE.editingSchedule = null; // Reset edit state
         cacheTab('admin-schedule', { schedule: data, notes: notes });
         renderAdminSchedule();
         showLoading(false);
         tabLoaded();
       };
       google.script.run.withSuccessHandler(d => { data = d || {}; done(); })
         .withFailureHandler(err => { showLoading(false); tabLoadFailed('the schedule', err); })
         .getScheduleData(STATE.building);
       // Notes are an extra: if they fail to load, the grid still shows without them.
       google.script.run
         .withSuccessHandler(n => { notes = n || {}; done(); })
         .withFailureHandler(() => { notes = {}; done(); })
         .getScheduleNotes(STATE.building);
    }

    /** The admin's notes on one grid cell: [{ text, email }], email blank for the whole period. */
    function scheduleNotesFor(month, period, day) {
       const m = (STATE.scheduleNotes || {})[month] || {};
       return (m[period] || {})[day] || [];
    }

    /** One note as drawn in a cell; `who` names the teacher when it isn't on their card. */
    function scheduleNoteHtml(text, who) {
       return `<div class="flex items-start gap-1.5 text-[11px] leading-snug text-amber-900 bg-amber-50 border border-amber-300 rounded px-2 py-1 break-words" title="Admin note">
         <i class="fas fa-sticky-note text-amber-500 mt-0.5"></i><span class="whitespace-pre-line min-w-0">${who ? `<span class="font-bold">${escapeHtml(who)}:</span> ` : ''}${escapeHtml(text)}</span>
       </div>`;
    }

    function scheduleStaffName(email) {
       const s = (STATE.user.staffData || []).find(x => (x.email || '').toLowerCase() === email);
       return s ? displayName(s.name) : email;
    }

    function renderAdminSchedule() {
       const scheduleData = STATE.scheduleData;
       if (!scheduleData) return;

       if (!STATE.expandedMonths) STATE.expandedMonths = new Set();

       const html = `
         <div class="space-y-4">
           <div class="flex justify-between items-center mb-4">
             <div>
               <h2 class="text-2xl font-bold text-ops-blue-dark">Master Schedule</h2>
               <p class="text-sm text-ops-gray">Find and manage coverage by month, day, and period.</p>
             </div>
           </div>
           
           ${MONTHS.map((month, index) => {
             // State Persistence Logic
             const accordionId = `admin-month-${index}`;
             // If we are editing this month, force it open
             if (STATE.editingSchedule && STATE.editingSchedule.month === month) {
                 STATE.expandedMonths.add(accordionId);
             }
             const isOpen = STATE.expandedMonths.has(accordionId);
             // The month body is its own scroll box (capped at most of the screen) so the
             // day-of-week row stays pinned while scrolling down the periods. It can't pin
             // to the page itself: the card clips its overflow, which stops sticky there.
             const scrollBox = "border-t border-gray-200 p-1 overflow-auto max-h-[75vh]";
             const contentClass = isOpen ? scrollBox : "hidden " + scrollBox;
             const iconClass = isOpen ? "fas fa-chevron-down text-gray-400 transition-transform rotate-180" : "fas fa-chevron-down text-gray-400 transition-transform";
             
             return `
               <div class="bg-white rounded-lg shadow border border-gray-200 overflow-hidden">
                 <button onclick="toggleAccordion('admin-month-${index}')" class="w-full px-6 py-4 flex justify-between items-center bg-gray-50 hover:bg-gray-100 transition">
                   <div class="flex items-center gap-3">
                     <span class="font-bold text-lg text-ops-gray-dark">${month}</span>
                     <span class="text-xs bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">${scheduleData[month]?.length || 0} Entries</span>
                   </div>
                   <i id="icon-admin-month-${index}" class="${iconClass}"></i>
                 </button>
                 
                 <div id="content-admin-month-${index}" data-month="${month}" data-rendered="${isOpen ? '1' : ''}" class="${contentClass}">
                    ${isOpen ? adminScheduleMonthBody(month) : ''}
                 </div>
               </div>
             `;
           }).join('')}
         </div>
       `;
       
       document.getElementById('view-container').innerHTML = html;

    /**
     * One month's grid of the Master Schedule. Only the months that are open are
     * drawn — toggleAccordion draws the rest the first time they are opened. Every
     * month used to be built up front and then hidden, which is most of the work in
     * opening the tab, and an admin rarely needs more than the current month.
     */
    function adminScheduleMonthBody(month) {
       const scheduleData = STATE.scheduleData || {};
       const periods = getPeriods();
       const comparePeriods = schedulePeriodsAreComparable();

       // Build matrix: Period x Day -> [Teachers]
       const matrix = {};
       periods.forEach(p => {
         matrix[p] = {};
         DAYS.forEach(d => matrix[p][d] = []);
       });

       (scheduleData[month] || []).forEach(entry => {
         const dayList = entry.days.split(',');
         dayList.forEach(day => {
           // Check if period still exists (config might have changed, or data is old)
           if (matrix[entry.period] && matrix[entry.period][day]) {
             matrix[entry.period][day].push(entry);
           }
         });
       });

       return `
                    <!-- Fixed layout: the Period column gets a set width and the five days split the
                         rest evenly, so the week fits the card. Below the min width it scrolls. -->
                    <table class="w-full min-w-[56rem] table-fixed divide-y divide-gray-200 border-separate" style="border-spacing: 0;">
                      <colgroup>
                        <col class="w-44">
                        ${DAYS.map(() => '<col>').join('')}
                      </colgroup>
                      <thead>
                        <tr>
                          <th class="px-4 py-3 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider sticky top-0 left-0 z-30 border-b border-gray-200">Period</th>
                          ${DAYS.map(d => `<th class="px-4 py-3 bg-gray-50 text-left text-xs font-bold text-gray-500 uppercase tracking-wider sticky top-0 z-20 border-b border-gray-200 shadow-sm">${d}</th>`).join('')}
                        </tr>
                      </thead>
                      <tbody class="bg-white divide-y divide-gray-200">
                        ${periods.map((p, pIndex) => {
                          const isEditing = STATE.editingSchedule && STATE.editingSchedule.month === month && STATE.editingSchedule.period === p;
                          const rowBg = pIndex % 2 === 1 ? 'bg-gray-50' : 'bg-white';
                          const eP = escapeHtml(p);
                          const periodAttrs = `data-month="${month}" data-period="${eP}"`;
                          
                          if (isEditing) {
                             // --- EDIT MODE ROW ---
                             return `
                               <tr class="bg-blue-50/50">
                                 <td class="px-4 py-3 break-words text-sm font-medium text-gray-900 sticky left-0 z-10 border-r border-blue-200 shadow-sm bg-blue-50 align-top">
                                   <div class="flex flex-col gap-2">
                                     <span>${eP}</span>
                                     <div class="flex flex-col gap-1 mt-2">
                                       <button ${periodAttrs} onclick="saveAdminSchedulePeriod(this.dataset.month, this.dataset.period)" class="bg-green-600 hover:bg-green-700 text-white text-xs px-2 py-1.5 rounded font-bold transition">
                                         <i class="fas fa-save mr-1"></i> Save
                                       </button>
                                       <button onclick="cancelAdminScheduleEdit()" class="bg-gray-300 hover:bg-gray-400 text-gray-700 text-xs px-2 py-1.5 rounded font-bold transition">
                                         Cancel
                                       </button>
                                       <label class="flex items-start gap-1.5 mt-1 text-[11px] font-normal text-gray-600 cursor-pointer" title="Standing meetings are usually the same all year">
                                         <input type="checkbox" ${STATE.editingSchedule.notesAllMonths ? 'checked' : ''} onchange="STATE.editingSchedule.notesAllMonths = this.checked" class="mt-0.5 rounded border-gray-300 text-ops-blue">
                                         Apply notes to every month
                                       </label>
                                     </div>
                                   </div>
                                 </td>
                                 ${DAYS.map(d => {
                                    // Get current temp state for this day
                                    const currentEmails = STATE.editingSchedule.changes[d] || []; 
                                    // Map emails back to names for display
                                    // We need to look up names from staffData
                                    const chips = currentEmails.map(email => {

                                             <i class="fas fa-times"></i>
                                           </button>
                                         </span>`;
                                    }).join('');

                                    return `
                                      <td class="px-2 py-2 align-top border-r border-blue-100 last:border-r-0">
                                        <div class="flex flex-wrap gap-1.5 mb-2">

                                        </div>
                                        <div class="relative group">

                                            placeholder="Add teacher..."

                                ${DAYS.map(d => {
                                   // Least committed first: approved hours plus coverage already
                                   // scheduled for them (scheduledHoursMap_ on the server).
                                   const teachers = matrix[p][d].sort((a,b) =>
                                     (a.hours + (a.scheduledHours || 0)) - (b.hours + (b.scheduledHours || 0)));
                                   // A note about a teacher goes on their card; one about the whole
                                   // period — or about someone not listed in this cell — stays on top.

                                                  if (match) shortPd = match[1];
                                                  const nameParts = r.subbedFor.trim().split(' ');
                                                  const lastName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : r.subbedFor;
                                                  return `
                                                    <div class="border-b border-blue-900/50 pb-2 mb-2 last:border-0 last:pb-0 last:mb-0">

                                                const tooltipHtml = `
                                                  <div class="font-bold text-blue-100 border-b border-blue-500/30 pb-2 mb-2 uppercase tracking-wide text-[10px] flex items-center gap-2">
                                                    <i class="fas fa-clock"></i> Pending Requests (${pendingCount})
                                                  </div>
                                                  <div>${listItems}</div>
                                                `;

                                                // The tooltip markup travels in a data attribute: escaped once here,
                                                // decoded once by the browser, then handed to showTooltip intact.
                                                pendingIndicator = `
                                                  <i class="fas fa-hourglass-half text-orange-500 ml-1 cursor-help hover:text-orange-600 transition-colors"
                                                     data-tooltip="${escapeHtml(tooltipHtml)}"
                                                     onmouseenter="showTooltip(event, this.dataset.tooltip)"
                                                     onmousemove="moveTooltip(event)" 
                                                     onmouseleave="hideTooltip()">
                                                  </i>`;
                                             }

                                             // Already booked another period that same day. Gray rather
                                             // than orange: nothing collides in this cell, but the admin
                                             // should see it before taking a second prep from them.
                                             const elsewhere = otherPeriodsSameDay(t, month, d, p, comparePeriods);
                                             if (elsewhere.length > 0) {

                                                        <span class="bg-gray-700 text-gray-100 px-1.5 py-0.5 rounded text-[10px] font-medium">${escapeHtml(e.kind)}</span>
                                                      </div>
                                                      <div class="text-gray-300 truncate text-[11px]">${escapeHtml(e.period)}</div>

                                                    </div>`).join('');
                                                const elsewhereTooltip = `
                                                  <div class="font-bold text-gray-100 border-b border-gray-500/30 pb-2 mb-2 uppercase tracking-wide text-[10px] flex items-center gap-2">

                                                     onmouseenter="showTooltip(event, this.dataset.tooltip)"
                                                     onmousemove="moveTooltip(event)"
                                                     onmouseleave="hideTooltip()">

                                             // same month, same weekday, same period. That is exactly the
                                             // booking picking them here again would collide with, so the
                                             // dates sit on the card rather than behind a hover.
                                             const booked = (t.assignments || []).filter(a =>

                                               (!comparePeriods || a.period === p));
                                             let assignedIndicator = '';

                                             if (booked.length > 0) {

                                                const bookedTooltip = `

                                                       data-tooltip="${escapeHtml(bookedTooltip)}"
                                                       onmouseenter="showTooltip(event, this.dataset.tooltip)"
                                                       onmousemove="moveTooltip(event)"
                                                       onmouseleave="hideTooltip()">

                                                    ? ` <span class="text-indigo-600 font-medium whitespace-nowrap" title="Coverage already assigned to them that isn't approved yet, across all of their buildings (upcoming, not yet filed, or waiting for approval)">(+${Math.round(t.scheduledHours * 10) / 10} scheduled)</span>`
                                                    : ''}</div>
                                                  ${assignedIndicator}
                                                  ${cellNotes.filter(n => n.email && n.email === (t.email || '').toLowerCase()).map(n => `
                                                    <div class="mt-1 flex items-start gap-1 text-[10px] leading-snug text-amber-900 break-words" title="Admin note">
                                                      <i class="fas fa-sticky-note text-amber-500 mt-0.5"></i><span class="whitespace-pre-line min-w-0">${escapeHtml(n.text)}</span>

    function toggleAccordion(id) {
       const content = document.getElementById(`content-${id}`);
       const icon = document.getElementById(`icon-${id}`);
       
       if (!STATE.expandedMonths) STATE.expandedMonths = new Set();

       if (content.classList.contains('hidden')) {
         // A Master Schedule month is drawn the first time it is opened.
         if (content.dataset.month && content.dataset.rendered !== '1') {
           content.innerHTML = adminScheduleMonthBody(content.dataset.month);
           content.dataset.rendered = '1';
         }
         content.classList.remove('hidden');
         icon.classList.add('rotate-180');
         STATE.expandedMonths.add(id);
       } else {
         content.classList.add('hidden');
         icon.classList.remove('rotate-180');
         STATE.expandedMonths.delete(id);
       }
    }
    
    // --- Admin Schedule Editing Logic ---

    function toggleAdminScheduleEdit(month, period) {
      // 1. Initialize Editing State
      // We need to convert the View Matrix back into an editable map: { "Mon": [emails], "Tue": ... }
      
      const changes = {};
      DAYS.forEach(d => changes[d] = []);
      
      // Populate from current data
      // Find entries for Month/Period
      const entries = (STATE.scheduleData[month] || []).filter(e => e.period === period);
      entries.forEach(e => {
         const days = e.days.split(',');
         days.forEach(d => {
            if(changes[d]) changes[d].push(e.email);
         });
      });

      // Copies, so Cancel leaves the loaded notes as they were.
      const notes = {};
      DAYS.forEach(d => notes[d] = scheduleNotesFor(month, period, d).map(n => ({ text: n.text, email: n.email || '' })));

      STATE.editingSchedule = {
        month: month,
        period: period,
        changes: changes,
        notes: notes,
        notesAllMonths: false
      };
      
      renderAdminSchedule();
      // Auto-open accordion if needed (it should be open since we clicked edit inside it)
    }

    function cancelAdminScheduleEdit() {
      STATE.editingSchedule = null;
      renderAdminSchedule();
    }

    const SCHEDULE_NOTES_PER_CELL = 10; // the server keeps no more than this

    /**
     * One day's notes in the period editor. Each can be about the whole period or one
     * teacher; the list offers the teachers in this cell, plus whoever a note is
     * already about, so a teacher removed from the cell keeps their note.
     */
    function scheduleNotesEditorHtml(day, cellEmails) {
      const notes = STATE.editingSchedule.notes[day] || [];
      const rows = notes.map((n, i) => {
        const options = cellEmails.map(e => e.toLowerCase());
        if (n.email && !options.includes(n.email)) options.push(n.email);
        return `
          <div class="mt-2 border border-amber-300 bg-amber-50 rounded p-1.5">
            <div class="flex items-center gap-1 mb-1">
              <select data-day="${day}" data-index="${i}" onchange="STATE.editingSchedule.notes[this.dataset.day][this.dataset.index].email = this.value"
                class="flex-1 min-w-0 text-[11px] border border-amber-300 bg-white rounded px-1 py-0.5" title="Who the note is about">
                <option value="">Whole period</option>
                ${options.map(e => `<option value="${escapeHtml(e)}" ${e === n.email ? 'selected' : ''}>${escapeHtml(scheduleStaffName(e))}</option>`).join('')}
              </select>
              <button data-day="${day}" data-index="${i}" onclick="removeScheduleNote(this.dataset.day, Number(this.dataset.index))" class="text-amber-600 hover:text-red-500 px-1 focus:outline-none" title="Remove note">
                <i class="fas fa-times"></i>
              </button>
            </div>
            <textarea rows="2" maxlength="200" placeholder="Note (e.g. 7th grade team meeting)" data-day="${day}" data-index="${i}"
              oninput="STATE.editingSchedule.notes[this.dataset.day][this.dataset.index].text = this.value"
              class="w-full text-xs border border-amber-300 bg-white rounded px-2 py-1.5 focus:ring-2 focus:ring-amber-400 focus:border-amber-400">${escapeHtml(n.text)}</textarea>
          </div>`;
      }).join('');
      const add = notes.length < SCHEDULE_NOTES_PER_CELL
        ? `<button data-day="${day}" onclick="addScheduleNote(this.dataset.day, '')" class="mt-2 text-[11px] font-bold text-amber-700 hover:text-amber-900 focus:outline-none">
             <i class="fas fa-plus mr-1"></i>Add note
           </button>`
        : '';
      return rows + add;
    }

    function addScheduleNote(day, email) {
      if (!STATE.editingSchedule) return;
      const list = STATE.editingSchedule.notes[day] || (STATE.editingSchedule.notes[day] = []);
      if (list.length >= SCHEDULE_NOTES_PER_CELL) return;
      list.push({ text: '', email: (email || '').toLowerCase() });
      renderAdminSchedule();
      const boxes = document.querySelectorAll(`textarea[data-day="${day}"]`);
      if (boxes.length) boxes[boxes.length - 1].focus();
    }

    function removeScheduleNote(day, index) {
      if (!STATE.editingSchedule) return;
      (STATE.editingSchedule.notes[day] || []).splice(index, 1);
      renderAdminSchedule();
    }

    function removeTeacherFromSchedule(day, email) {
      if (!STATE.editingSchedule) return;
      const list = STATE.editingSchedule.changes[day];
      const idx = list.indexOf(email);
      if (idx > -1) {
        list.splice(idx, 1);
        renderAdminSchedule(); // Re-render to update UI
      }
    }

    function addTeacherToSchedule(day, email) {
      if (!STATE.editingSchedule) return;
      const list = STATE.editingSchedule.changes[day];
      if (!list.includes(email)) {
        list.push(email);
        renderAdminSchedule();
      }
    }

    function renderScheduleAutocomplete(input, day, month, periodSafe) {
      const query = input.value.toLowerCase();
      // Remove spaces/special chars from period for ID safety (matches HTML generation)
      const periodId = periodSafe.replace(/[^a-zA-Z0-9]/g,'');
      const container = document.getElementById(`ac-${month}-${periodId}-${day}`);
      
      if (!query) {
        container.classList.add('hidden');
        return;
      }

      const matches = STATE.user.staffData.filter(s => s.name.toLowerCase().includes(query) || s.email.toLowerCase().includes(query));
      
      if (matches.length > 0) {
        container.innerHTML = matches.map(s => `
          <div data-day="${escapeHtml(day)}" data-email="${escapeHtml(s.email)}" onclick="selectScheduleTeacher(this.dataset.day, this.dataset.email)" class="px-3 py-2 hover:bg-blue-50 cursor-pointer border-b border-gray-100 last:border-0">
            <div class="font-bold text-gray-800">${escapeHtml(displayName(s.name))}</div>
            <div class="text-xs text-gray-500">${escapeHtml(s.email)}</div>
          </div>
        `).join('');
        container.classList.remove('hidden');
      } else {
        container.classList.add('hidden');
      }
    }

    function selectScheduleTeacher(day, email) {
      addTeacherToSchedule(day, email);
    }

    function saveAdminSchedulePeriod(month, period) {
      if (!STATE.editingSchedule) return;
      
      const dayUpdates = STATE.editingSchedule.changes; // { "Mon": [emails]... }
      const dayNotes = STATE.editingSchedule.notes;     // { "Mon": [{ text, email }], ... }
      const allMonths = !!STATE.editingSchedule.notesAllMonths;
      
      showLoading(true);
      google.script.run.withSuccessHandler(() => {
         // Reload data to reflect changes
         STATE.editingSchedule = null;
         loadAdminSchedule(); // This handles showLoading(false) internally
         showToast("Schedule updated successfully.", "success");
      }).withFailureHandler(err => {
         showLoading(false);
         showToast("Error saving schedule: " + err, "error");
      }).updateSchedulePeriod(month, period, dayUpdates, STATE.building, dayNotes, allMonths);
    }

    /**
     * Assign coverage. Opened from the Schedule grid with a teacher already chosen,
     * or from Reassign with the slot pre-filled and the teacher left open.
     *
     * The duration controls mirror the teacher's own Submit form rather than being
     * hardcoded to Full/Half Period: a periods building gets its configured coverage
     * types, and a time-range building gets start/end pickers with the hours worked
     * out from the span, which is how OIS and SE record time everywhere else.
     */
    function openAssignCoverageModal(tEmail, tName, period, month, prefill) {
      const pre = prefill || {};
      const bConfig = STATE.config[STATE.building] || STATE.config[STATE.defaultBuilding] || {};
      const isPeriods = bConfig.scheduleType !== 'time_range';
      const coverageTypes = (bConfig.coverageTypes || []).filter(t => t.value !== 'custom');
      const sortedStaff = sortStaffData(STATE.user.staffData, STATE.sortOption);

      const teacherHtml = tEmail
        ? `<input type="hidden" name="teacherEmail" value="${escapeHtml(tEmail)}">
           <input type="hidden" name="teacherName" value="${escapeHtml(tName)}">
           <div class="mb-4 bg-blue-50 p-4 rounded border border-blue-100">
             <label class="block text-xs font-bold text-ops-blue uppercase tracking-wider mb-1">Assigning Coverage To</label>
             <div class="text-lg font-bold text-ops-blue-dark">${escapeHtml(displayName(tName))}</div>
             <div class="text-sm text-ops-gray">${escapeHtml(period)}</div>
           </div>`
        : `<div class="mb-4">
             <label class="block text-sm font-bold text-ops-gray-dark mb-2">Who is covering?</label>
             <select name="teacherPick" required class="block w-full rounded border-gray-300 p-2 border bg-gray-50">
               <option value="">-- Select Staff Member --</option>
               ${sortedStaff.map(s => `<option value="${escapeHtml(s.email)}" data-name="${escapeHtml(s.name)}">${escapeHtml(displayName(s.name))}</option>`).join('')}
             </select>
           </div>`;

      const timeHtml = isPeriods
        ? `<input type="hidden" name="period" value="${escapeHtml(period)}">`
        : `<div class="grid grid-cols-2 gap-4 mb-4">
             <div>
               <label class="block text-sm font-bold text-ops-gray-dark mb-2">Start Time</label>
               <input type="time" name="startTime" step="${escapeHtml((bConfig.increment || 15) * 60)}" required class="block w-full rounded border-gray-300 p-2 border">
             </div>
             <div>
               <label class="block text-sm font-bold text-ops-gray-dark mb-2">End Time</label>
               <input type="time" name="endTime" step="${escapeHtml((bConfig.increment || 15) * 60)}" required class="block w-full rounded border-gray-300 p-2 border">
             </div>
           </div>`;

      const durationHtml = isPeriods
        ? `<div class="mb-4">
             <label class="block text-sm font-bold text-ops-gray-dark mb-2">Duration</label>
             <div class="flex gap-4">
               ${coverageTypes.map((t, idx) => `
                 <label class="flex-1 cursor-pointer">
                   <input type="radio" name="duration" value="${escapeHtml(t.value)}" data-label="${escapeHtml(t.label)}" ${idx === 0 ? 'checked' : ''} class="peer sr-only">
                   <div class="rounded-lg border border-gray-300 p-3 text-center hover:bg-gray-50 peer-checked:border-ops-blue peer-checked:bg-ops-blue-lighter peer-checked:text-ops-blue-dark transition">
                     <div class="font-bold">${escapeHtml(t.label)}</div>
                   </div>
                 </label>`).join('')}
             </div>
           </div>`
        : `<div class="mb-4 text-sm text-ops-gray"><i class="fas fa-info-circle mr-1"></i> Duration is calculated from the time range.</div>`;

      const modalContent = `
        <form onsubmit="handleAssignCoverageSubmit(event)">
          ${teacherHtml}

          <div class="mb-4">
            <label class="block text-sm font-bold text-ops-gray-dark mb-2">Date Needed</label>
            <input type="date" name="date" value="${escapeHtml(pre.date || '')}" required oninput="refreshAssignThankYou(this.form)" class="block w-full rounded border-gray-300 p-2 border focus:border-ops-blue focus:ring-1 focus:ring-ops-blue">
            ${month ? `<p class="text-xs text-gray-400 mt-1">Month: ${escapeHtml(month)}</p>` : ''}
          </div>

          ${timeHtml}
          ${durationHtml}

          <div class="mb-4">
            <label class="block text-sm font-bold text-ops-gray-dark mb-2">Who needs coverage?</label>
            <select id="req-sub-type" onchange="toggleAssignSubInput(this.value)" class="block w-full rounded border-gray-300 shadow-sm p-2 border bg-gray-50 mb-2">
              <option value="Staff">Staff Member</option>
              <option value="Other" ${pre.coveredForName && !pre.coveredForEmail ? 'selected' : ''}>Other (Manual)</option>
            </select>

            <div id="req-sub-staff-container" class="${pre.coveredForName && !pre.coveredForEmail ? 'hidden' : ''}">
              <select name="subbedNameDropdown" class="block w-full rounded border-gray-300 p-2 border">
                ${sortedStaff.map(s => `<option value="${escapeHtml(s.email)}" data-name="${escapeHtml(s.name)}" ${pre.coveredForEmail === s.email ? 'selected' : ''}>${escapeHtml(displayName(s.name))}</option>`).join('')}
              </select>
            </div>
            <div id="req-sub-manual-container" class="${pre.coveredForName && !pre.coveredForEmail ? '' : 'hidden'}">
              <input type="text" name="subbedNameManual" value="${escapeHtml(pre.coveredForEmail ? '' : (pre.coveredForName || ''))}" placeholder="e.g. Activity Bus / Meeting" class="block w-full rounded border-gray-300 p-2 border">
              <p class="text-xs text-gray-400 mt-1">A manual entry has no email address, so nobody is notified that their class is covered.</p>
            </div>
          </div>

          <div class="mb-6 border-t border-gray-200 pt-4">
            <label class="block text-sm font-bold text-ops-gray-dark mb-2">Note <span class="font-normal text-ops-gray">(optional)</span></label>
            <textarea name="note" rows="3" data-auto="1" oninput="this.dataset.auto = '0'" placeholder="e.g. Sub plans are on the desk" class="block w-full rounded border-gray-300 p-2 border text-sm">${escapeHtml(assignThankYouNote(pre.date))}</textarea>
            <div class="flex flex-wrap gap-4 mt-2">
              <label class="flex items-center text-xs text-ops-gray-dark">
                <input type="checkbox" name="noteToSub" checked class="rounded border-gray-300 text-ops-blue mr-2"> Include for the person covering
              </label>
              <label class="flex items-center text-xs text-ops-gray-dark">
                <input type="checkbox" name="noteToCovered" class="rounded border-gray-300 text-ops-blue mr-2"> Include for the person being covered
              </label>
            </div>
          </div>

          <div class="flex justify-end gap-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Cancel</button>
            <button type="submit" class="px-4 py-2 bg-ops-blue text-white rounded hover:bg-ops-blue-dark font-bold shadow-sm">
              <i class="fas fa-paper-plane mr-2"></i> Assign Coverage
            </button>
          </div>
        </form>`;

      showModal("Assign Coverage", modalContent);
    }

    /**
     * The note the Assign modal starts with. It is only a starting point: the admin
     * can edit it or clear it, and once they type in it, changing the date leaves
     * their wording alone.
     */
    function assignThankYouNote(ymd) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || '');
      const when = m
        ? ' on ' + new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })
        : '';
      return `Thank you for being available for TST coverage${when}. We appreciate your willingness to help!`;
    }

    function refreshAssignThankYou(form) {
      if (form && form.note && form.note.dataset.auto === '1') {
        form.note.value = assignThankYouNote(form.date.value);
      }
    }

    function toggleAssignSubInput(val) {
      const staff = document.getElementById('req-sub-staff-container');
      const manual = document.getElementById('req-sub-manual-container');
      if (val === 'Other') {
        staff.classList.add('hidden');
        manual.classList.remove('hidden');
      } else {
        staff.classList.remove('hidden');
        manual.classList.add('hidden');
      }
    }

    /** Reads the modal into the payload assignCoverage expects, or null if invalid. */
    function buildAssignPayload(form) {
      const bConfig = STATE.config[STATE.building] || STATE.config[STATE.defaultBuilding] || {};
      const isPeriods = bConfig.scheduleType !== 'time_range';
      const isOther = form.querySelector('#req-sub-type').value === 'Other';

      let teacherEmail = '';
      let teacherName = '';
      if (form.teacherEmail) {
        teacherEmail = form.teacherEmail.value;
        teacherName = form.teacherName.value;
      } else {
        const pick = form.teacherPick;
        teacherEmail = pick.value;
        teacherName = pick.selectedOptions.length ? pick.selectedOptions[0].dataset.name : '';
        if (!teacherEmail) {
          showToast("Choose who is covering.", "error");
          return null;
        }
      }

      let period = '';
      let amount = 0;
      let amountType = '';

      if (isPeriods) {
        period = form.period.value;
        amount = parseFloat(form.duration.value);
        const checked = form.querySelector('input[name="duration"]:checked');
        amountType = checked ? checked.dataset.label : '';
      } else {
        const start = form.startTime.value;
        const end = form.endTime.value;
        period = `${start} - ${end}`;
        const diffHrs = (new Date(`2000-01-01T${end}`) - new Date(`2000-01-01T${start}`)) / 3600000;
        if (!(diffHrs > 0)) {
          showToast("End time must be after start time.", "error");
          return null;
        }
        amount = Number(diffHrs.toFixed(2));
        amountType = "Time Range";
      }

      let subbedFor = '';
      let coveredForEmail = '';
      if (isOther) {
        subbedFor = form.subbedNameManual.value.trim();
      } else {
        const picked = form.subbedNameDropdown;
        coveredForEmail = picked.value;
        subbedFor = picked.selectedOptions.length ? picked.selectedOptions[0].dataset.name : '';
      }
      if (!subbedFor) {
        showToast("Say who needs coverage.", "error");
        return null;
      }

      const note = form.note.value.trim();
      return {
        teacherEmail: teacherEmail,
        teacherName: teacherName,
        subbedFor: subbedFor,
        coveredForEmail: coveredForEmail,
        date: form.date.value,
        period: period,
        amount: amount,
        amountType: amountType,
        building: STATE.building,
        note: note,
        noteToSub: note ? form.noteToSub.checked : false,
        noteToCovered: note ? form.noteToCovered.checked : false
      };
    }

    function handleAssignCoverageSubmit(e) {
      e.preventDefault();
      const payload = buildAssignPayload(e.target);
      if (!payload) return;
      closeModal();
      sendAssignment(payload);
    }

    function sendAssignment(payload) {
      showLoading(true);
      google.script.run.withSuccessHandler(res => {
        showLoading(false);

        // Two things the server asks about rather than refusing: covering twice in
        // one day (legitimate), and re-assigning a period that was cancelled (usually
        // a mistake, but it is also how an admin undoes an accidental cancellation).
        // Both confirm and re-send with force.
        if (res && res.conflict) {
          const wasCancelled = res.cancelled || [];
          const alsoAssigned = res.existing || [];
          let body = '';

          if (wasCancelled.length > 0) {
            const c = wasCancelled[0];
            const who = c.cancelledBy ? escapeHtml(c.cancelledBy) : 'Someone';
            const when = c.cancelledOn ? ` on ${escapeHtml(c.cancelledOn)}` : '';
            const forWhom = c.coveredFor ? `, covering for ${escapeHtml(c.coveredFor)}` : '';
            body += `
              <p class="text-ops-red font-bold"><i class="fas fa-undo mr-1"></i>This exact coverage was cancelled.</p>
              <p class="text-sm text-ops-gray-dark mt-2 text-left">
                <strong>${escapeHtml(res.name)}</strong> was assigned
                ${escapeHtml(res.period || '')} on ${escapeHtml(res.date)}${forWhom},
                and ${who} cancelled it${when}.
              </p>`;
          }

          if (alsoAssigned.length > 0) {
            const list = alsoAssigned
              .map(x => `<li>${escapeHtml(x.period)} &mdash; covering for ${escapeHtml(x.coveredFor)}</li>`)
              .join('');
            body += `
              <p class="text-sm text-ops-gray-dark text-left ${wasCancelled.length ? 'mt-3' : ''}">
                <strong>${escapeHtml(res.name)}</strong> is ${wasCancelled.length ? 'also ' : ''}already assigned on ${escapeHtml(res.date)}:</p>
              <ul class="text-sm text-left list-disc list-inside mt-1 text-ops-gray-dark">${list}</ul>`;
          }

          openConfirmModal(
            wasCancelled.length > 0 ? "This was cancelled earlier" : "Already covering that day",
            body + `<p class="text-sm text-gray-500 mt-3">${
              wasCancelled.length > 0 ? 'Assign it again?' : 'Assign this period as well?'}</p>`,
            () => sendAssignment(Object.assign({}, payload, { force: true })),
            wasCancelled.length > 0 ? "Assign Again" : "Assign Anyway"
          );
          return;
        }

        showToast(`${payload.teacherName} has been assigned.`, "success");
        if (STATE.currentTab === 'admin-assignments') loadAdminAssignments();
        // The grid the admin is standing in now has one more booking on it, and the
        // whole point of the marker is not picking the same person again — so redraw
        // rather than leave them looking at a card that says they are free.
        else if (STATE.currentTab === 'admin-schedule') loadAdminSchedule();
        else updateBadges();
      }).withFailureHandler(err => {
        showLoading(false);
        showToast("Could not assign: " + err, "error");
      }).assignCoverage(payload);
    }

  </script>
</body>
</html>
